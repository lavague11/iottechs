<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Satellite Capture</title>
<style>
  :root{color-scheme:light;--ink:#101112;--muted:#6b7076;--line:#e3e5e8;--soft:#f6f7f8;--gold:#b98a2e;--r:10px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font:15px/1.45 var(--sans);color:var(--ink);background:#fff;display:flex;flex-direction:column;overflow:hidden}

  .head{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px 11px;border-bottom:1px solid var(--line)}
  .head .lbl{display:none}   /* seamless in the survey: just the search bar, no tool label */
  .head input{flex:1;min-width:0;padding:10px 13px;font-size:15px;border:1px solid var(--line);border-radius:var(--r);outline:none;color:var(--ink)}
  .head input:focus{border-color:var(--ink)}
  .head button{flex:none;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:var(--r);cursor:pointer;padding:0}
  .head button:hover{border-color:var(--ink);color:var(--ink)}
  .head button:disabled{opacity:.5}

  .stage{flex:1;position:relative;min-height:0;background:var(--soft);overflow:hidden}
  #mapRot{position:absolute;inset:-60%;transform-origin:center center;will-change:transform}
  #map{position:absolute;inset:0}
  #msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:var(--muted);font-size:13px;padding:24px;z-index:6}
  #msg.on{display:grid}
  #draw{position:absolute;inset:0;z-index:5;display:none;touch-action:none;cursor:crosshair}
  #draw.on{display:block}
  #drawCv{position:absolute;inset:0;width:100%;height:100%}

  #preview{position:absolute;inset:0;background:var(--soft);display:none;z-index:8}
  #preview.show{display:block}
  /* leveling grid — fixed reference lines (4 across, 4 down) shown while Level is active */
  #levelGrid{position:absolute;inset:0;z-index:9;pointer-events:none;display:none;opacity:.7;mix-blend-mode:difference;
    background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
    background-size:20% 20%}
  #levelGrid.on{display:block}
  #prevImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  /* before/after compare — enhanced is the base (#prevImg); original overlays it, clipped to the left of the handle */
  #cmpBefore{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:6;display:none;pointer-events:none}
  #preview.cmp #cmpBefore{display:block}
  /* auto before/after scanner — a glowing line rides the reveal edge (no dragging) */
  #cmpHandle{position:absolute;top:0;bottom:0;left:0;z-index:7;width:3px;transform:translateX(-1px);
    background:linear-gradient(180deg,rgba(255,240,205,.15),rgba(255,244,214,.98) 45%,rgba(255,240,205,.15));
    box-shadow:0 0 20px 4px rgba(185,138,46,.75),0 0 0 1px rgba(0,0,0,.12);display:none;pointer-events:none}
  #preview.cmp #cmpHandle{display:block}
  #cmpHandle .grip{display:none}   /* no drag knob in auto mode */
  /* Before / After — identical minimal opaque pills; only the active (live) side gets the gold accent */
  .cmpTag{position:absolute;top:12px;z-index:8;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#12151b;padding:6px 14px;border-radius:20px;display:none;cursor:pointer;pointer-events:auto;box-shadow:0 2px 10px rgba(0,0,0,.35);transition:transform .12s,background .2s,box-shadow .2s;-webkit-user-select:none;user-select:none}
  #preview.cmp .cmpTag{display:block}
  .cmpTag:hover{transform:scale(1.05)}
  .cmpTag.cmpB{left:12px}
  .cmpTag.cmpA{right:12px}
  .cmpTag.live{background:#b98a2e;box-shadow:0 0 0 2px rgba(255,244,214,.85),0 3px 14px rgba(185,138,46,.5)}
  /* pixel "materialize" reveal of the enhanced aerial + a scanner sweep once it lands */
  @keyframes pxReveal{0%{filter:blur(18px) contrast(1.7) brightness(1.25);transform:scale(1.05);opacity:.25}
    45%{opacity:1}100%{filter:none;transform:none;opacity:1}}
  #preview.revealing #prevImg{animation:pxReveal 1.5s cubic-bezier(.2,.7,.2,1) both;image-rendering:pixelated}
  #preview.revealing::after{content:"";position:absolute;left:0;right:0;height:14%;z-index:9;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(255,240,205,.5) 55%,rgba(255,255,255,.92) 92%,rgba(255,240,205,.4));
    box-shadow:0 0 48px 12px rgba(185,138,46,.5);animation:revScan 1.5s ease-in-out both}
  @keyframes revScan{0%{top:-14%}100%{top:100%}}
  /* in-progress enhance: a Google-Earth drone pull-back into space (rotating globe), then a fast
     punch back in when it lands. "We're fixing our satellites." */
  #scan{position:absolute;inset:0;z-index:10;display:none;overflow:hidden;background:radial-gradient(circle at 50% 42%,#0b1a34,#02040a 70%)}
  #scan.on{display:block}
  /* video mode (when the two enhance clips are present) replaces the CSS globe */
  #scan .scanVid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:1;background:#02040a}
  #scan.has-vid .stars,#scan.has-vid .space{display:none}
  #scan.vid-start #vidStart{display:block}
  #scan.vid-load #vidLoad{display:block}
  #scan.vid-end #vidEnd{display:block}
  #scan .stars{position:absolute;inset:0;opacity:0;animation:starsIn 1.3s ease .25s forwards;
    background-image:
      radial-gradient(1.2px 1.2px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 28% 68%,#cfe0ff,transparent),
      radial-gradient(1.4px 1.4px at 46% 14%,#fff,transparent),radial-gradient(1px 1px at 62% 52%,#fff,transparent),
      radial-gradient(1.2px 1.2px at 78% 28%,#dbe8ff,transparent),radial-gradient(1px 1px at 88% 74%,#fff,transparent),
      radial-gradient(1px 1px at 8% 84%,#fff,transparent),radial-gradient(1.3px 1.3px at 36% 88%,#fff,transparent),
      radial-gradient(1px 1px at 70% 82%,#cfe0ff,transparent),radial-gradient(1.2px 1.2px at 54% 34%,#fff,transparent),
      radial-gradient(1px 1px at 20% 46%,#fff,transparent),radial-gradient(1px 1px at 94% 44%,#fff,transparent)}
  @keyframes starsIn{to{opacity:.9}}
  #scan .space{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-origin:50% 50%;
    animation:zoomOut 1.6s cubic-bezier(.16,.84,.3,1) both}
  @keyframes zoomOut{0%{transform:scale(7.5)}100%{transform:scale(1)}}
  #scan.exit .space{animation:zoomIn .95s cubic-bezier(.7,0,.85,.35) both}
  @keyframes zoomIn{0%{transform:scale(1);opacity:1}72%{opacity:1}100%{transform:scale(13);opacity:0}}
  .earth{width:min(46vmin,260px);height:min(46vmin,260px);border-radius:50%;position:relative;overflow:hidden;
    box-shadow:0 0 70px 14px rgba(70,140,255,.4),0 0 150px 40px rgba(40,90,200,.22)}
  .earth::before{content:"";position:absolute;inset:0;background-repeat:repeat-x;background-size:200% 100%;
    background-image:
      radial-gradient(ellipse 20% 30% at 14% 42%,#2f8a45 0 58%,transparent 61%),
      radial-gradient(ellipse 15% 24% at 38% 62%,#37954d 0 58%,transparent 61%),
      radial-gradient(ellipse 19% 32% at 60% 34%,#2c8a44 0 58%,transparent 61%),
      radial-gradient(ellipse 13% 20% at 80% 60%,#35914a 0 58%,transparent 61%),
      radial-gradient(ellipse 12% 18% at 96% 30%,#2f8a45 0 58%,transparent 61%),
      linear-gradient(#12559e,#0c4487);
    animation:earthSpin 7s linear infinite}
  @keyframes earthSpin{from{background-position:0 0}to{background-position:-200% 0}}
  .earth .cloud{position:absolute;inset:0;background-repeat:repeat-x;background-size:200% 100%;opacity:.55;mix-blend-mode:screen;
    background-image:radial-gradient(ellipse 16% 11% at 30% 30%,#fff 0 52%,transparent 56%),
      radial-gradient(ellipse 20% 9% at 66% 56%,#fff 0 52%,transparent 56%),
      radial-gradient(ellipse 13% 8% at 48% 74%,#fff 0 52%,transparent 56%);
    animation:earthSpin 5s linear infinite}
  .earth::after{content:"";position:absolute;inset:0;border-radius:50%;
    box-shadow:inset -28px -20px 55px rgba(0,0,0,.68),inset 26px 18px 45px rgba(150,200,255,.28);
    background:radial-gradient(circle at 33% 28%,rgba(255,255,255,.42),rgba(255,255,255,0) 42%)}
  #scan .cap{position:absolute;left:0;right:0;bottom:26px;text-align:center;color:#eaf1ff;font-size:14px;font-weight:700;letter-spacing:.04em;text-shadow:0 1px 10px rgba(0,0,0,.7);z-index:2}
  #scan .cap b{display:inline-block;min-width:16px;text-align:left}
  .pvbar{position:absolute;right:14px;bottom:14px;display:flex;gap:8px;align-items:center;z-index:9}
  /* revision box — opens on a second wand click to say what to change */
  #revBox{position:absolute;right:14px;bottom:64px;z-index:10;display:none;gap:8px;align-items:center;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:var(--r);padding:7px 8px 7px 12px;box-shadow:0 6px 22px rgba(16,17,18,.2);backdrop-filter:blur(6px)}
  #revBox.on{display:flex}
  #revBox input{border:0;outline:none;font:inherit;font-size:13px;color:var(--ink);width:min(46vw,300px);background:transparent}
  #revBox button{border:0;background:var(--gold);color:#fff;border-radius:8px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer}
  .pv{border:1px solid var(--line);background:#fff;border-radius:var(--r);height:38px;padding:0 13px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);box-shadow:0 2px 12px rgba(16,17,18,.14)}
  .pv svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .pv.use{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pv.wand{width:38px;padding:0;justify-content:center}
  .pv.wand svg{stroke:var(--gold)}
  .pv.wand.busy{opacity:.55;pointer-events:none}

  /* step wizard */
  .wiz{flex:none;border-top:1px solid var(--line);background:#fff}
  .steps{display:flex;padding:8px 12px 0}
  .steps .s{flex:1;text-align:center;font-size:11.5px;color:var(--muted);padding-bottom:9px;border-bottom:2px solid var(--line);cursor:pointer;font-weight:500}
  .steps .s.active{color:var(--ink);font-weight:600;border-color:var(--ink)}
  .steps .s.done{color:var(--ink)}
  .steps .s.done::before{content:"\2713  ";color:var(--gold)}
  .panel{padding:11px 16px;display:none;align-items:center;gap:10px}
  .panel.on{display:flex}
  .panel label{font-size:12px;color:var(--muted);width:46px;flex:none}
  .panel input[type=range]{flex:1;accent-color:var(--ink)}
  .panel .val{font-size:13px;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
  .panel .rz{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer}
  .panel .hint{font-size:12.5px;color:var(--muted)}
  .nav{display:flex;align-items:center;gap:10px;padding:2px 16px 12px}
  .nav .grow{flex:1;text-align:center;font-size:12px;color:var(--muted)}
  .b{border-radius:var(--r);padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:#fff}
  .b.lite{background:#fff;color:var(--ink);border-color:var(--line)}
  .b:disabled{opacity:.45;cursor:default}

  /* ===== compact vertical toolbar pinned to the RIGHT (keeps the aerial clear) ===== */
  .tbar{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:12;display:flex;flex-direction:column;align-items:stretch;gap:3px;
    background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 8px 30px rgba(16,17,18,.2);backdrop-filter:blur(8px)}
  .tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:46px;height:44px;padding:0;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--ink);font:600 8.5px/1.1 var(--sans);cursor:pointer}
  .tb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tb:hover{background:var(--soft)}
  .tb.on{background:var(--ink);color:#fff}
  .tb.wand svg{stroke:var(--gold)}
  .tb.wand.busy{opacity:.5;pointer-events:none}
  .tb.use{background:var(--ink);color:#fff}
  .tb.use:hover{background:#000}
  .tsep{height:1px;width:calc(100% - 6px);background:var(--line);margin:2px auto}
  /* popovers open to the LEFT of the toolbar */
  .pop{position:absolute;z-index:13;right:58px;top:50%;transform:translateY(-50%);display:none;align-items:center;gap:10px;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:0 10px 34px rgba(16,17,18,.22);white-space:nowrap}
  .pop.on{display:flex}
  .pop label{font-size:12px;color:var(--muted);font-weight:600}
  .pop input[type=range]{width:150px;accent-color:var(--ink)}
  .pop .val{font-size:13px;min-width:40px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
  .pop .rz{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit}
  .pop .rz:hover{border-color:var(--gold)}
  .pop .pophint{font-size:12px;color:var(--muted)}
  /* editable exact-angle field (merged the old 0° reset + readout into one settable input) */
  .pop .degfield{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff}
  .pop .degfield:focus-within{border-color:var(--gold)}
  .pop .degfield input{width:38px;border:0;outline:0;background:transparent;font:600 13px/1 var(--sans);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
  .pop .degfield input::-webkit-outer-spin-button,.pop .degfield input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .pop .degfield span{font-size:13px;color:var(--muted)}
  /* On a phone the toolbar is centred on the right edge, so its pop-out would land mid-screen — dock it to the bottom instead. */
  /* Narrow phones OR short landscape: dock the Level pop to the bottom instead of mid-screen. */
  @media (max-width:640px), (max-height:560px){
    .pop{position:fixed;z-index:20;right:10px;left:10px;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:none;justify-content:center;flex-wrap:wrap;box-shadow:0 10px 30px rgba(16,17,18,.22)}
    .pop input[type=range]{width:auto;flex:1 1 120px;min-width:100px}
  }
  /* Landscape / short viewport: shrink the search header so the map (.stage flex:1) keeps real height. */
  @media (max-height:520px){
    .head{padding:6px 12px}
    .head input{padding:7px 11px;font-size:14px}
    .head button{width:36px;height:36px}
  }
  /* Desktop (roomy viewport): the thumb-first vertical rail on the right edge reads as an awkward
     floating strip with a mid-screen pop-out. Dock it as a proper horizontal toolbar centred along
     the bottom, with the Rotate pop opening straight above it — the conventional editor layout. */
  @media (min-width:641px) and (min-height:561px){
    .tbar{top:auto;bottom:16px;right:50%;transform:translateX(50%);flex-direction:row;align-items:center;gap:4px;padding:6px 8px;border-radius:14px}
    .tb{flex-direction:column;width:58px;height:50px;gap:3px;font-size:9.5px}
    .tb svg{width:20px;height:20px}
    .tsep{width:1px;height:34px;margin:0 3px}
    .pop{right:50%;left:auto;top:auto;bottom:78px;transform:translateX(50%);justify-content:center}
  }
  /* Google Places autocomplete dropdown — above everything */
  .pac-container{z-index:99999;border-radius:10px;border:1px solid var(--line);box-shadow:0 8px 28px rgba(16,17,18,.16);font-family:var(--sans);margin-top:2px}
</style>
</head>

    <span class="lbl">Satellite Capture</span>
    <input id="q" type="text" placeholder="Address or business" autocomplete="off" enterkeyhint="search">
    <button id="show" title="Search this address" aria-label="Search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
  </div>
  <div class="stage">
    <div id="mapRot"><div id="map"></div></div>
    <div id="levelGrid"></div>
    <div id="draw"><canvas id="drawCv"></canvas></div>
    <div id="msg" class="on">Loading map…</div>
    <div id="preview">
      <img id="prevImg" alt="captured aerial">
      <img id="cmpBefore" alt="original aerial">
      <span class="cmpTag cmpB" id="cmpTagB">Before</span>
      <span class="cmpTag cmpA" id="cmpTagA">After</span>
      <div id="cmpHandle"><span class="grip"><svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg></span></div>
      <div id="scan">
        <video id="vidStart" class="scanVid" muted playsinline preload="auto"></video>
        <video id="vidLoad" class="scanVid" muted playsinline preload="auto"></video>
        <video id="vidEnd" class="scanVid" muted playsinline preload="auto"></video>
        <!-- CSS-globe fallback if the clips are missing -->
        <div class="stars"></div>
        <div class="space"><div class="earth"><div class="cloud"></div></div></div>
        <div class="cap">We&rsquo;re fixing our satellites<b id="scanDots">…</b></div>
      </div>
      <div id="revBox"><input id="revIn" type="text" maxlength="200" placeholder="What should change? e.g. clear the junk by the pool"><button id="revGo">Revise</button></div>
    </div>

    <!-- floating toolbar over the aerial: Level · Crop · Enhance · Download · Done -->
    <div class="tbar" id="tbar">
      <div class="pop" id="popLevel">
        <label>Rotate</label>
        <input id="rot" type="range" min="-45" max="45" value="0">
        <button class="rz" id="rot90" title="Turn a further 90°">+90°</button>
        <div class="degfield"><input id="rotDeg" type="number" min="-180" max="180" step="1" value="0" title="Set the exact angle" aria-label="Angle in degrees"><span>&deg;</span></div>
      </div>
      <button class="tb" id="tLevel" title="Level the aerial"><svg viewBox="0 0 24 24"><rect x="2" y="9" width="20" height="6" rx="2"/><circle cx="12" cy="12" r="1.5"/><path d="M9 9.5v5M15 9.5v5"/></svg><span>Level</span></button>
      <button class="tb" id="tCrop" title="Crop the aerial"><svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg><span>Crop</span></button>
      <span class="tsep"></span>
      <button class="tb wand" id="tEnhance" title="Enhance with AI"><svg viewBox="0 0 24 24"><path d="M9.5 14.5 3 21"/><path d="M15 3l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/><path d="M18.5 13l.6 1.9 1.9.6-1.9.6-.6 1.9-.6-1.9-1.9-.6 1.9-.6z"/></svg></button>
      <button class="tb" id="tDl" title="Download"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></button>
      <button class="tb use" id="tDone">Done</button>
    </div>
  </div>

<script>
  var API_KEY=null, map=null, geocoder=null, marker=null;
  var PID=new URLSearchParams(location.search).get("project")||"";
  var DEMO="2503 Jay Place, Union, NJ 07083", FT=3.28084;
  var viewRot=0, step=0, rect=null;
  function $(id){return document.getElementById(id);}
  function msg(m){ var el=$("msg"); if(!m){el.classList.remove("on");return;} el.textContent=m; el.classList.add("on"); }
  function norm(d){ return ((d+180)%360+360)%360-180; }

  fetch("/api/config"+(PID?"?project="+encodeURIComponent(PID):"")).then(function(r){return r.json();}).then(function(c){
    if(c&&c.address) $("q").value=c.address;
    var key=c&&c.googleMapsApiKey;
    if(!key){ msg("Add GOOGLE_MAPS_API_KEY in Development ▸ API Keys, then reopen."); return; }
    API_KEY=key;
    var s=document.createElement("script");
    s.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(key)+"&libraries=geometry,places&callback=initMap&v=weekly";
    s.async=true; s.onerror=function(){ msg("Map failed to load — check the key + billing."); };
    document.head.appendChild(s);
  }).catch(function(){ msg("Couldn't reach /api/config."); });
  window.gm_authFailure=function(){ msg("Key rejected — enable Maps JS API + billing for this referrer."); };

  window.initMap=function(){
    msg("");
    map=new google.maps.Map($("map"),{ center:{lat:40.6588,lng:-74.2957}, zoom:20, mapTypeId:"satellite", tilt:0,
      streetViewControl:false, mapTypeControl:false, fullscreenControl:false, rotateControl:false, zoomControl:false,
      keyboardShortcuts:false, gestureHandling:"greedy", isFractionalZoomEnabled:true });
    geocoder=new google.maps.Geocoder();
    map.addListener("zoom_changed", function(){ invalidateCapture(); });   // zoom via wheel / pinch → drop any stale capture
    $("show").addEventListener("click", function(){ search($("q").value.trim()); });
    $("q").addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); search($("q").value.trim()); }});
    // Google Places autocomplete on the address box — pick a suggestion → fly the map there.
    try {
      if(google.maps.places){
        // No `types` filter → addresses AND businesses/establishments both suggest.
        var ac=new google.maps.places.Autocomplete($("q"), { fields:["geometry","formatted_address","name"] });
        ac.addListener("place_changed", function(){ var p=ac.getPlace(); if(!p||!p.geometry) return;
          map.setCenter(p.geometry.location); map.setZoom(20);
          if(marker) marker.setMap(null); marker=new google.maps.Marker({map:map,position:p.geometry.location});
          // For a business, show "Name — address"; for a plain address just the address.
          $("q").value = (p.name && p.formatted_address && p.formatted_address.indexOf(p.name)<0) ? (p.name+" — "+p.formatted_address) : (p.formatted_address || p.name || $("q").value);
          invalidateCapture(); });
      }
    } catch(e){}
    initDraw();
    search(($("q").value||DEMO).trim(), true);
  };
  var rotCoarse=0;   // 90° steps from the +90° button; the slider is the fine ±45 trim on top, so any angle is reachable
  function applyRot(){ viewRot=norm(rotCoarse + (parseInt($("rot").value,10)||0)); var _rd=$("rotDeg"); if(_rd && document.activeElement!==_rd) _rd.value=viewRot; $("mapRot").style.transform="rotate("+viewRot+"deg)"; if(map) google.maps.event.trigger(map,"resize"); }
  function search(q, isInitial){ if(!q||!geocoder) return; $("show").disabled=true;
    geocoder.geocode({address:q}, function(res,st){ $("show").disabled=false;
      if(st!=="OK"||!res.length){ if(isInitial && q!==DEMO) search(DEMO,true); return; }   // couldn't find it → land on the test property
      var r=res[0], t=(r.types||[]).join(" ");
      // On first load, a project saved with only a state/county/country (no street) geocodes to a
      // useless centroid ("New Jersey, USA"). Don't strand the user there — fall back to the test
      // property. A precise street address is always honored; typed searches are never overridden.
      if(isInitial && q!==DEMO && /administrative_area_level_1|administrative_area_level_2|\bcountry\b/.test(t) && !/street_address|premise|route|point_of_interest|establishment/.test(t)){ search(DEMO,true); return; }
      var loc=r.geometry.location; map.setCenter(loc); map.setZoom(20);
      if(marker) marker.setMap(null); marker=new google.maps.Marker({map:map,position:loc});
      var cur=($("q").value||"").trim(), fa=r.formatted_address||"";
      if(fa && (cur.indexOf(",")<0 || fa.length>cur.length)) $("q").value=fa; }); }

  /* ---------- slider handlers (ids unchanged; live-edit the map) ---------- */
  $("rot").addEventListener("input", function(){ applyRot(); invalidateCapture(); });
  $("rot90").addEventListener("click", function(){ rotCoarse=(rotCoarse+90)%360; applyRot(); invalidateCapture(); });
  // Type an exact angle — sets the absolute rotation (the ±45 slider becomes a fine trim on top of it).
  function commitRotDeg(){ var d=parseInt($("rotDeg").value,10); if(isNaN(d)) d=0; rotCoarse=norm(d); $("rot").value=0; applyRot(); invalidateCapture(); }
  $("rotDeg").addEventListener("change", commitRotDeg);
  $("rotDeg").addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); commitRotDeg(); $("rotDeg").blur(); } });
  function ensureRect(){ if(!rect){ var st=document.querySelector(".stage"); rect={x:0,y:0,w:st.clientWidth,h:st.clientHeight}; } }   // no box drawn → capture the whole view

  /* ---------- floating toolbar: Level · Crop · Enhance · Download · Done ---------- */
  var capturedCurrent=false, cropMode=false;
  var preview=$("preview");
  document.body.appendChild($("popLevel"));   // lift the Level pop out of the (transformed) toolbar so it can dock as a fixed bottom bar on mobile
  function closePops(){ $("popLevel").classList.remove("on"); $("tLevel").classList.remove("on"); $("levelGrid").classList.remove("on"); }
  // Back from the frozen preview to the live, pannable map so the framing can change again.
  function backToLive(){ preview.classList.remove("show"); resetCompare(); enhancedOnce=false; capturedCurrent=false; $("tEnhance").classList.remove("busy"); }
  // Any framing change (rotate/zoom/crop) drops a stale capture so the next action re-shoots.
  function invalidateCapture(){ if(capturedCurrent){ capturedCurrent=false; preview.classList.remove("show"); } }
  // Freeze the current framing into a preview (whole view unless a crop box was drawn).
  function ensureCaptured(){
    if(capturedCurrent) return Promise.resolve(true);
    if(!map||!API_KEY) return Promise.resolve(false);
    ensureRect();
    return capture().then(function(ok){ if(ok){ capturedCurrent=true; preview.classList.add("show"); } return ok; });
  }
  function exitCrop(){ if(cropMode){ cropMode=false; $("draw").classList.remove("on"); $("tCrop").classList.remove("on"); } }
  $("tLevel").addEventListener("click", function(){ if(preview.classList.contains("show")) backToLive();
    var open=!$("popLevel").classList.contains("on"); exitCrop(); closePops();   // Level and Crop are mutually exclusive — leaving one enters the other cleanly (no rotate-vs-crop-layer tangle)
    $("popLevel").classList.toggle("on",open); $("tLevel").classList.toggle("on",open); $("levelGrid").classList.toggle("on",open); });
  $("tCrop").addEventListener("click", function(){ if(preview.classList.contains("show")) backToLive();
    if(cropMode){
      // second tap: crop — the drawn box if there is one, otherwise the whole view
      cropMode=false; $("draw").classList.remove("on"); $("tCrop").classList.remove("on"); closePops();
      ensureCaptured();
    } else {
      cropMode=true; $("draw").classList.add("on"); $("tCrop").classList.add("on"); closePops();
    } });
  // Committing (Enhance/Download/Done) freezes the frame — tuck the popovers + crop tool away first.
  function commitUI(){ if(cropMode){ cropMode=false; $("draw").classList.remove("on"); $("tCrop").classList.remove("on"); } closePops(); }
  $("tDl").addEventListener("click", function(){ commitUI(); ensureCaptured().then(function(ok){ if(ok) downloadImg(); }); });
  $("tDone").addEventListener("click", function(){ commitUI(); ensureCaptured().then(function(ok){ if(ok) usePreview(); }); });
  $("tEnhance").addEventListener("click", function(){ if($("tEnhance").classList.contains("busy")) return;
    if(enhancedOnce){ $("revBox").classList.contains("on")?closeRev():openRev(); return; }
    commitUI(); ensureCaptured().then(function(ok){ if(ok) enhance(""); }); });

  /* ---------- crop box ---------- */
  function initDraw(){
    var layer=$("draw"), cornerA=null, dragging=false;
    layer.addEventListener("wheel", function(e){ e.preventDefault(); if(!map) return; var z=map.getZoom()+(e.deltaY<0?0.3:-0.3); map.setZoom(Math.max(17,Math.min(21,z))); }, {passive:false});   // zoom still works over the crop layer
    layer.addEventListener("pointerdown", function(e){ e.preventDefault(); layer.setPointerCapture(e.pointerId);
      var r=layer.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
      if(!cornerA){ cornerA={x:x,y:y}; rect=null; dragging=true; } else { finishRect(x,y); cornerA=null; }
      paint(); });
    layer.addEventListener("pointermove", function(e){ if(!dragging||!cornerA) return; var r=layer.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
      rect={x:Math.min(cornerA.x,x),y:Math.min(cornerA.y,y),w:Math.abs(x-cornerA.x),h:Math.abs(y-cornerA.y)}; paint(); });
    layer.addEventListener("pointerup", function(){ if(dragging&&rect&&rect.w>16&&rect.h>16){ dragging=false; cornerA=null; } else if(dragging){ dragging=false; } paint(); });
    window.addEventListener("resize", paint);
  }
  function finishRect(x,y){ /* cornerA set globally? no — handled in initDraw closure via two-tap; kept simple with drag */ }
  function paint(){
    var cv=$("drawCv"), box=$("draw"), dpr=window.devicePixelRatio||1, W=box.clientWidth, H=box.clientHeight; if(!W||!H) return;
    cv.width=W*dpr; cv.height=H*dpr; var g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
    if(!rect) return;
    g.fillStyle="rgba(16,17,18,.34)"; g.beginPath(); g.rect(0,0,W,H); g.rect(rect.x,rect.y,rect.w,rect.h); g.fill("evenodd");
    g.strokeStyle="#fff"; g.lineWidth=2; g.strokeRect(rect.x,rect.y,rect.w,rect.h);
  }

  /* ---------- capture: stitch tiles, rotate, cut the rect (math from the survey handoff) ---------- */
  var MAX_TILES=16, tileCache={}, MAX_EDGE=2600, capCanvas=null;
  function loadTile(url){ if(tileCache[url]) return Promise.resolve(tileCache[url]); var k=Object.keys(tileCache); if(k.length>120) delete tileCache[k[0]];
    return new Promise(function(res,rej){ var n=0; (function go(){ var im=new Image(); im.crossOrigin="anonymous"; im.onload=function(){tileCache[url]=im;res(im);}; im.onerror=function(){(++n<2)?setTimeout(go,350):rej(0);}; im.src=url+(n?"&r="+n:""); })(); }); }
  function wx(ll){ return (ll.lng()+180)/360*256; }
  function wy(ll){ var s=Math.sin(ll.lat()*Math.PI/180); return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256; }
  function unproject(x,y){ var lng=x/256*360-180,n=Math.PI-2*Math.PI*y/256; return new google.maps.LatLng(180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))),lng); }
  function capture(){ return new Promise(function(RES){
    if(!map||!API_KEY||!rect){ return RES(false); }
    msg("Capturing…");
    var stage=document.querySelector(".stage"), sw=stage.clientWidth, sh=stage.clientHeight;
    var c=map.getCenter(), zView=map.getZoom(), mppView=156543.03392*Math.cos(c.lat()*Math.PI/180)/Math.pow(2,zView);
    var need=Math.sqrt(sw*sw+sh*sh)*mppView*1.06;
    var zt=Math.min(21,Math.round(zView)), mppTile, sf, span, cols, rows, box;
    while(true){ mppTile=156543.03392*Math.cos(c.lat()*Math.PI/180)/Math.pow(2,zt); sf=Math.pow(2,zt)*2;
      var halfWU=(need/mppTile)/Math.pow(2,zt)/2, cxW=wx(c), cyW=wy(c); box={x0:cxW-halfWU,x1:cxW+halfWU,y0:cyW-halfWU,y1:cyW+halfWU,cxW:cxW,cyW:cyW};   // span the FULL diagonal so the leveled (rotated) view has no bare corners
      span=640/Math.pow(2,zt); cols=Math.ceil((box.x1-box.x0)/span); rows=Math.ceil((box.y1-box.y0)/span);
      if(cols*rows<=MAX_TILES||zt<=15) break; zt--; }
    var oX=box.x0, oY=box.y0, W=Math.ceil((box.x1-box.x0)*sf), H=Math.ceil((box.y1-box.y0)*sf), mppMosaic=mppTile/2;
    var mosaic=document.createElement("canvas"); mosaic.width=W; mosaic.height=H; var mg=mosaic.getContext("2d"), jobs=[], missed=0;
    for(var r=0;r<rows;r++) for(var cc=0;cc<cols;cc++){ (function(col,row){
      var cxw=oX+(col+0.5)*span, cyw=oY+(row+0.5)*span, ll=unproject(cxw,cyw);
      var url="https://maps.googleapis.com/maps/api/staticmap?center="+ll.lat().toFixed(7)+","+ll.lng().toFixed(7)+"&zoom="+zt+"&size=640x640&scale=2&format=png&maptype="+(map.getMapTypeId()==="hybrid"?"hybrid":"satellite")+"&key="+API_KEY;
      var dx=Math.round((cxw-span/2-oX)*sf), dy=Math.round((cyw-span/2-oY)*sf), dsz=Math.round(span*sf);
      jobs.push(loadTile(url).then(function(im){ mg.drawImage(im,dx,dy,dsz,dsz); }).catch(function(){ missed++; }));
    })(cc,r); }
    Promise.all(jobs).then(function(){
      if(missed>=cols*rows){ msg("Tiles failed — check Maps Static API + billing"); return RES(false); }
      var scale=mppView/mppMosaic;
      var stageCv=document.createElement("canvas"); stageCv.width=Math.round(sw*scale); stageCv.height=Math.round(sh*scale);
      var sg=stageCv.getContext("2d"), mcx=(box.cxW-oX)*sf, mcy=(box.cyW-oY)*sf;
      sg.translate(stageCv.width/2, stageCv.height/2); sg.rotate(viewRot*Math.PI/180); sg.drawImage(mosaic,-mcx,-mcy);
      var cut=document.createElement("canvas"); cut.width=Math.max(4,Math.round(rect.w*scale)); cut.height=Math.max(4,Math.round(rect.h*scale));
      cut.getContext("2d").drawImage(stageCv, Math.round(rect.x*scale), Math.round(rect.y*scale), Math.round(rect.w*scale), Math.round(rect.h*scale), 0,0, cut.width, cut.height);
      var longest=Math.max(cut.width,cut.height);
      if(longest>MAX_EDGE){ var s=MAX_EDGE/longest, ds=document.createElement("canvas"); ds.width=Math.round(cut.width*s); ds.height=Math.round(cut.height*s); var dg=ds.getContext("2d"); dg.imageSmoothingQuality="high"; dg.drawImage(cut,0,0,ds.width,ds.height); cut=ds; }
      capCanvas=cut; $("prevImg").src=cut.toDataURL("image/jpeg",0.92); resetCompare(); enhancedOnce=false; closeRev(); $("tEnhance").title="Enhance with AI"; msg(""); RES(true);
    });
  }); }

  /* ---------- finalized actions ---------- */
  function usePreview(){ try{ parent.postMessage({type:"satellite-capture-result", dataUrl:$("prevImg").src}, "*"); }catch(e){} }
  function downloadImg(){ var a=document.createElement("a"); a.href=$("prevImg").src; a.download="satellite-capture.jpg"; a.click(); }

  /* Auto before/after scanner — no dragging. #prevImg (enhanced) is the base; #cmpBefore (original)
     overlays it, revealed from the left as a glowing scanner line sweeps. cmpPos: 0 = all AFTER
     (enhanced) · 100 = all BEFORE (original). It plays itself; the Before/After tags jump on tap. */
  var cmpPos=0, cmpLoop=null;
  function setCut(pos){ cmpPos=Math.max(0,Math.min(100,pos));
    $("cmpBefore").style.clipPath="inset(0 "+(100-cmpPos)+"% 0 0)";
    $("cmpHandle").style.left=cmpPos+"%";
    $("cmpTagB").classList.toggle("live",cmpPos>=50); $("cmpTagA").classList.toggle("live",cmpPos<50); }
  function cmpTransition(on){ var t=on?"1.1s cubic-bezier(.6,0,.2,1)":"none";
    $("cmpBefore").style.transition=on?"clip-path "+t:"none"; $("cmpHandle").style.transition=on?"left "+t:"none"; }
  function stopCmpLoop(){ if(cmpLoop){ clearTimeout(cmpLoop); cmpLoop=null; } }
  function showSide(before){ cmpTransition(true); setCut(before?100:0); }
  function resetCompare(){ stopCmpLoop(); preview.classList.remove("cmp","revealing"); cmpTransition(false); setCut(0); $("cmpBefore").src=""; }
  function showCompare(beforeSrc, afterSrc){
    $("cmpBefore").src=beforeSrc; $("prevImg").src=afterSrc;
    preview.classList.add("cmp"); cmpTransition(false); setCut(0);   // show the enhanced result; no auto-cycle — tap the tags to compare
  }
  // Manual only — tap a tag to jump to that side. Nothing animates on its own.
  $("cmpTagB").addEventListener("click", function(){ showSide(true); });   // Before
  $("cmpTagA").addEventListener("click", function(){ showSide(false); });  // After

  var scanTimer=null, hasStart=false, hasLoad=false, hasEnd=false;
  // 3 enhance clips: zoom-out (start) → rotating (loops while enhancing) → zoom-in (reveal). Each is
  // probed independently; a missing loading clip falls back to the CSS globe, a missing zoom-in to the
  // CSS punch-in, so nothing breaks.
  (function(){ var a=$("vidStart"), b=$("vidLoad"), c=$("vidEnd");
    a.src="media/zoom-out.mp4"; b.src="media/rotating.mp4"; c.src="media/zoom-in.mp4";
    a.addEventListener("loadeddata",function(){hasStart=true;}); a.addEventListener("error",function(){hasStart=false;});
    b.addEventListener("loadeddata",function(){hasLoad=true;});  b.addEventListener("error",function(){hasLoad=false;});
    c.addEventListener("loadeddata",function(){hasEnd=true;});   c.addEventListener("error",function(){hasEnd=false;});
  })();
  function startDots(){ clearInterval(scanTimer); var n=0; scanTimer=setInterval(function(){ n=(n+1)%4; $("scanDots").textContent=".".repeat(n+1); }, 320); }
  function playV(v){ try{ v.currentTime=0; var p=v.play(); if(p&&p.catch)p.catch(function(){}); }catch(_){} }
  function loadLoop(){ var s=$("scan"); s.classList.remove("vid-start"); s.classList.add("vid-load"); var v=$("vidLoad"); v.loop=true; playV(v); }   // rotating loop for the wait
  function scanOn(on){ var s=$("scan");
    if(on){ s.classList.remove("exit","vid-start","vid-load","vid-end"); s.classList.add("on"); startDots();
      if(hasLoad){ s.classList.add("has-vid");
        if(hasStart){ s.classList.add("vid-start"); var a=$("vidStart"); a.loop=false; a.onended=loadLoop; playV(a); }   // zoom out → then loop
        else loadLoop();
      } else { s.classList.remove("has-vid"); }   // no loading clip → CSS globe
    } else { s.classList.remove("on","exit","has-vid","vid-start","vid-load","vid-end"); clearInterval(scanTimer); scanTimer=null; try{$("vidStart").pause();$("vidLoad").pause();$("vidEnd").pause();}catch(_){} } }
  // Exit — play the zoom-IN clip (or the CSS punch-back-in), then hand off (reveal the enhanced aerial).
  function scanExit(cb){ var s=$("scan"); if(!s.classList.contains("on")){ if(cb)cb(); return; }
    if(hasEnd){ s.classList.add("has-vid"); s.classList.remove("vid-start","vid-load"); s.classList.add("vid-end"); var v=$("vidEnd"), done=false;
      function fin(){ if(done)return; done=true; s.classList.remove("on","exit","has-vid","vid-start","vid-load","vid-end"); clearInterval(scanTimer); scanTimer=null; try{v.pause();}catch(_){} if(cb)cb(); }
      v.loop=false; v.onended=fin; playV(v); setTimeout(fin, 8000);   // safety net if the clip stalls
    } else {
      s.classList.add("exit"); setTimeout(function(){ s.classList.remove("on","exit"); clearInterval(scanTimer); scanTimer=null; if(cb)cb(); }, 950);
    } }

  var enhancedOnce=false;
  function enhance(revision){ if(!capCanvas) return; var w=$("tEnhance");
    var beforeSrc=$("prevImg").src;                 // remember the pre-enhance aerial for the compare
    // OpenAI images/edits returns a 1024² SQUARE — pad the crop to a centered square before
    // sending, then crop the result back to the original proportions (so the aerial keeps its aspect).
    var ow=capCanvas.width, oh=capCanvas.height, S=Math.max(ow,oh), offX=Math.floor((S-ow)/2), offY=Math.floor((S-oh)/2);
    var sq=document.createElement("canvas"); sq.width=S; sq.height=S; var sg=sq.getContext("2d");
    sg.fillStyle="#000"; sg.fillRect(0,0,S,S); sg.drawImage(capCanvas,offX,offY);
    w.classList.add("busy"); resetCompare(); scanOn(true);
    sq.toBlob(function(blob){ var fd=new FormData(); fd.append("image",blob,"c.png"); fd.append("mode","aerial"); if(revision) fd.append("revision",revision);
      fetch("/api/enhance",{method:"POST",body:fd}).then(function(r){return r.json();}).then(function(d){ if(d.error) throw new Error(d.error);
        var ai=new Image(); ai.onload=function(){
          var k=ai.naturalWidth/S;                              // padded-square → square result scale
          var cw=Math.max(1,Math.round(ow*k)), ch=Math.max(1,Math.round(oh*k)), cx=Math.round(offX*k), cy=Math.round(offY*k);
          var cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
          cv.getContext("2d").drawImage(ai, cx,cy,cw,ch, 0,0,cw,ch);   // crop back to the original aspect
          capCanvas=cv; w.classList.remove("busy"); enhancedOnce=true; w.title="Revise…";
          var afterUrl=cv.toDataURL("image/jpeg",0.92);
          scanExit(function(){ showCompare(beforeSrc, afterUrl); });   // punch back in from space → reveal + before/after
        };
        ai.src="data:image/png;base64,"+d.b64;
      }).catch(function(e){ scanOn(false); w.classList.remove("busy"); msg(String(e.message||"Enhance failed")); setTimeout(function(){msg("");},2400); });
    },"image/png"); }
  // first wand click enhances; once enhanced, the wand opens a revision box (say what to change)
  function openRev(){ $("revBox").classList.add("on"); var i=$("revIn"); i.value=""; i.focus(); }
  function closeRev(){ $("revBox").classList.remove("on"); }
  function runRev(){ var v=$("revIn").value.trim(); closeRev(); enhance(v); }
  // Enhance / Download / Done are wired on the floating toolbar above; the revision box stays.
  $("revGo").addEventListener("click", runRev);
  $("revIn").addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); runRev(); } else if(e.key==="Escape") closeRev(); });
</script>
</body>
