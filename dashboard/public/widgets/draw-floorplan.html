<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Draw floor plan</title>
<style>
  :root{color-scheme:light;--ink:#101112;--muted:#6b7076;--line:#e3e5e8;--soft:#f6f7f8;--gold:#b98a2e;--r:10px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font:15px/1.45 var(--sans);color:var(--ink);background:#fff;display:flex;flex-direction:column;overflow:hidden}

  .stage{flex:1;position:relative;min-height:0;background:#fbfbfa;overflow:hidden}
  /* the grid is CONTEXTUAL now — drawn on the canvas, clipped to the region being edited (see drawGrid). The CSS graph-paper is retired so finished geometry looks finished. */
  #grid{display:none}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  #hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:calc(100vw - 120px);text-align:center;color:var(--muted);font-size:12.5px;pointer-events:none;z-index:2;
    background:rgba(251,251,250,.86);padding:4px 12px;border-radius:99px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  #hint b{color:var(--ink)}
  @media(max-width:640px){ #hint{top:54px;max-width:calc(100vw - 32px)} }

  /* label popover for the selected shape */
  /* Compact intelligent room-name combobox — input is the primary control; ≤5 ranked suggestions. */
  /* Floor selector: top-left, to the right of the home logo (the corner is taken); outside the bottom dock. */
  #floorSel{position:absolute;top:12px;left:12px;z-index:20;display:none}
  #floorSel.on{display:block}
  #floorBtn{display:inline-flex;align-items:center;gap:6px;height:28px;max-width:44vw;padding:0 9px 0 11px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.85);color:var(--ink);font:600 12.5px var(--sans);cursor:pointer;backdrop-filter:blur(4px)}
  #floorBtn:hover{border-color:var(--ink)} #floorBtn:disabled{cursor:default;border-color:var(--line)}
  #floorName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #floorBtn svg{width:13px;height:13px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #floorMenu{position:absolute;top:calc(100% + 6px);left:0;display:none;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(16,17,18,.22);padding:6px;min-width:150px;max-width:min(240px,calc(100vw - 24px));max-height:50vh;overflow:auto}
  #floorMenu.on{display:flex}
  #floorMenu button{display:block;border:0;background:transparent;color:var(--ink);font:600 13px var(--sans);padding:9px 12px;border-radius:9px;cursor:pointer;text-align:left;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #floorMenu button:hover:not(:disabled),#floorMenu button:focus-visible{background:var(--soft);outline:none}
  #floorMenu button:disabled{opacity:.4;cursor:default}
  #labelPop{position:absolute;z-index:9;display:none;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(16,17,18,.24);padding:6px;width:248px;max-width:calc(100vw - 24px)}
  #labelPop.on{display:flex}
  #labelPop input{width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:9px 10px;font:inherit;font-size:15px;font-weight:600;outline:none;color:var(--ink);background:var(--soft)}
  #labelPop input::placeholder{color:#9aa0a6;font-weight:500}
  #labelPop .lplist{display:flex;flex-direction:column;margin-top:4px}
  #labelPop .lplist:empty{margin-top:0}
  #labelPop .lpopt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #labelPop .lpopt:hover,#labelPop .lpopt.active{background:var(--soft)}
  #labelPop .lpopt.custom{color:var(--gold);font-weight:600}
  #labelPop .lpopt .lpk{margin-left:auto;font-size:11px;color:#9aa0a6;font-weight:600}
  /* Contextual popovers — double-click / second-tap opens a compact menu (Room actions · Door actions). */
  #roomMenu,#doorMenu{position:absolute;z-index:10;display:none;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(16,17,18,.22);padding:6px;min-width:184px;max-width:calc(100vw - 24px)}
  #roomMenu.on,#doorMenu.on{display:flex}
  #roomMenu button,#doorMenu button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--ink);font:600 13px var(--sans);padding:11px 12px;border-radius:9px;cursor:pointer;text-align:left;width:100%}
  #roomMenu button:hover,#doorMenu button:hover{background:var(--soft)}
  #roomMenu button.danger,#doorMenu button.danger{color:#c4553d}
  #roomMenu svg,#doorMenu svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  #roomMenu .rmsep,#doorMenu .rmsep{height:1px;background:var(--line);margin:4px 6px}

  #preview{position:absolute;inset:0;background:#fff;display:none;z-index:9}
  #preview.show{display:block}
  #prevImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  /* Canonical vectors re-drawn OVER the AI raster — same tight bbox+margin frame, same object-fit:contain, so walls/labels/doors land 1:1 on the PNG (proves the AI moved nothing). */
  #prevVec{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;display:none}
  #prevVec.on{display:block}
  #prevBar{position:absolute;top:12px;right:12px;z-index:11;display:flex;gap:8px}
  .pvb{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.95);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(16,17,18,.14);backdrop-filter:blur(4px)}
  .pvb:hover{border-color:var(--ink)} .pvb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pvb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  /* STALE badge + explicit Update — the geometry changed since the raster was made; never auto-regenerated. */
  #prevStale{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:11;display:none;align-items:center;gap:8px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:10px;padding:5px 6px 5px 11px;box-shadow:0 6px 22px rgba(16,17,18,.2)}
  #prevStale.on{display:flex}
  #prevStale span{font:700 12px var(--sans);color:#c4553d}
  #prevStale button{border:0;background:var(--gold);color:#fff;border-radius:8px;padding:7px 12px;font:700 12.5px var(--sans);cursor:pointer}
  #scan{position:absolute;inset:0;z-index:10;display:none;overflow:hidden;background:rgba(12,14,16,.28)}
  #scan.on{display:block}
  #scan .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(185,138,46,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(185,138,46,.16) 1px,transparent 1px);background-size:28px 28px;-webkit-mask:radial-gradient(circle at 50% 45%,#000,transparent 78%);mask:radial-gradient(circle at 50% 45%,#000,transparent 78%);animation:gp 1.7s ease-in-out infinite}
  @keyframes gp{0%,100%{opacity:.28}50%{opacity:.6}}
  #scan .beam{position:absolute;left:0;right:0;height:42%;top:-42%;background:linear-gradient(180deg,transparent,rgba(185,138,46,.2) 55%,rgba(255,240,205,.55) 92%,rgba(255,255,255,.9));box-shadow:0 0 30px 8px rgba(185,138,46,.35);animation:sm 1.5s cubic-bezier(.55,0,.45,1) infinite}
  @keyframes sm{0%{top:-42%}100%{top:100%}}
  #scan .cap{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.55)}
  #msg{position:absolute;left:0;right:0;bottom:70px;text-align:center;color:var(--muted);font-size:12.5px;z-index:11;display:none}
  #msg.on{display:block}
  #revBox{position:absolute;left:50%;transform:translateX(-50%);bottom:70px;z-index:12;display:none;gap:8px;align-items:center;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:10px;padding:7px 8px 7px 12px;box-shadow:0 6px 22px rgba(16,17,18,.2)}
  #revBox.on{display:flex}
  #revBox input{border:0;outline:none;font:inherit;font-size:13px;color:var(--ink);width:min(52vw,320px)}
  #revBox button{border:0;background:var(--gold);color:#fff;border-radius:8px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer}
  /* In-product confirm (replaces window.confirm): compact centered card over a light dim; Cancel quiet, one primary. */
  #confirmCard{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(16,17,18,.28);padding:16px}
  #confirmCard.on{display:flex}
  #confirmCard .cc{width:min(300px,100%);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(16,17,18,.24);padding:14px}
  #confirmCard .cct{font-size:14px;font-weight:700;color:var(--ink)}
  #confirmCard .ccb{margin-top:4px;font-size:12.5px;color:var(--muted)}
  #confirmCard .cca{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  #confirmCard button{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:600 13px var(--sans);cursor:pointer}
  #confirmCard button#ccOk{background:var(--ink);border-color:var(--ink);color:#fff}
  #confirmCard button#ccOk.danger{background:#c4553d;border-color:#c4553d}

  /* One compact bottom dock — a single row, never wraps: [Structure|Room] [+][Erase][snap] [•••] [Done]. */
  .tbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:14;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;max-width:calc(100vw - 16px);
    background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 8px 30px rgba(16,17,18,.2);backdrop-filter:blur(8px)}
  .seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:2px;flex:none}
  .segb{border:0;background:transparent;color:var(--ink);font:600 13px var(--sans);padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .segb.on{background:var(--ink);color:#fff}
  .segb.locked{opacity:.4;pointer-events:none}
  .segToggle{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:0;border-radius:11px;background:var(--ink);color:#fff;font:600 13px var(--sans);cursor:pointer;flex:none;white-space:nowrap}
  #modeMenu{left:0;right:auto}
  #modeMenu button .mchk{opacity:0}
  #modeMenu button.on .mchk{opacity:1;color:var(--gold)}
  .segToggle svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
  .stools{display:inline-flex;align-items:center;gap:6px}
  .tb{display:flex;align-items:center;gap:7px;height:40px;padding:0 13px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);font:600 13px var(--sans);cursor:pointer}
  .tb.ico{width:40px;padding:0;justify-content:center}
  .tb.snap{font-weight:800;font-size:15px}
  .tb.ico.on{background:var(--ink);color:#fff}
  .tb.ico.locked{opacity:.4;pointer-events:none}
  .tb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tb:hover{background:var(--soft)}
  .tb.ico.on:hover{background:#000}
  .tb.use{background:var(--ink);color:#fff;border-color:var(--ink);padding:0 18px;flex:none}
  .tb.use:hover{background:#000}
  .tb:disabled{opacity:.4;cursor:default}
  .tb.busy{opacity:.5;pointer-events:none}
  .morewrap{position:relative;display:inline-flex}
  .moremenu{position:absolute;bottom:calc(100% + 8px);right:0;display:none;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(16,17,18,.22);padding:6px;min-width:184px}
  .moremenu.on{display:flex}
  .moremenu button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--ink);font:600 13px var(--sans);padding:11px 12px;border-radius:9px;cursor:pointer;text-align:left;width:100%}
  .moremenu button:hover{background:var(--soft)}
  .moremenu button.danger{color:#c4553d}
  .moremenu button.busy{opacity:.5;pointer-events:none}
  .moremenu svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .moremenu #mClean svg{stroke:var(--gold)}
  /* Bottom-left canvas history controls */
  .histctl{position:absolute;left:14px;bottom:14px;z-index:14;display:flex;gap:8px}
  .hb{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.95);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(16,17,18,.14);backdrop-filter:blur(4px)}
  .hb:hover{border-color:var(--ink)}
  .hb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  @media(max-width:640px){
    .tbar{left:8px;right:8px;transform:none;max-width:none;bottom:calc(10px + env(safe-area-inset-bottom));gap:6px;justify-content:space-between}
    .segb{padding:9px 11px}
    .tb.ico{width:44px;height:44px}
    .tb.use{height:44px;padding:0 16px}
    .stools{gap:5px}
    .histctl{left:10px;bottom:calc(78px + env(safe-area-inset-bottom))}
    .hb{width:44px;height:44px}
  }
  @media(max-width:400px){ .tbar{gap:4px} .tb.ico{width:38px} .tb.use{padding:0 12px} .stools{gap:4px} .segToggle{padding:0 11px;gap:6px} }
</style>
<style id="ios-zoom-fix">/* BUG #42: iOS zooms + shifts the page when a focused field is under 16px. Keep tapping a text box from moving the screen on iPhone. */
@media (max-width:640px){input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]),select,textarea,[contenteditable]{font-size:16px!important}}</style>
</head>
<body>
  <div class="stage" id="stage">
    <div id="floorSel"><button id="floorBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Floor"><span id="floorName"></span><svg viewBox="0 0 24 24" id="floorChev"><path d="M6 9l6 6 6-6"/></svg></button><div id="floorMenu" role="listbox" aria-label="Floors"></div></div>
    <div id="grid"></div>
    <canvas id="cv"></canvas>
    <div id="hint"></div>
    <div id="labelPop">
      <input id="lpInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Name room">
      <div class="lplist" id="lpList"></div>
    </div>
    <div id="roomMenu" role="menu" aria-label="Room actions">
      <button id="rmMerge" role="menuitem"><svg viewBox="0 0 24 24"><path d="M7 3v5a6 6 0 0 0 6 6h4"/><path d="M14 11l3 3-3 3"/></svg> Merge</button>
      <button id="rmRemoveWall" role="menuitem"><svg viewBox="0 0 24 24"><path d="M3 9h5M16 9h5M3 15h7M14 15h7"/><path d="M12 4v16"/></svg> <span id="rmRemoveWallTxt">Remove wall</span></button>
      <button id="rmRename" role="menuitem"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg> Rename</button>
      <div class="rmsep"></div>
      <button id="rmDelete" class="danger" role="menuitem"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg> <span id="rmDeleteTxt">Delete room</span></button>
    </div>
    <div id="doorMenu" role="menu" aria-label="Door actions">
      <button id="dmFlip" role="menuitem"><svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M8 7l-5 5 5 5"/><path d="M16 7l5 5-5 5"/></svg> Flip hinge</button>
      <button id="dmOpenOnly" role="menuitem"><svg viewBox="0 0 24 24"><path d="M4 20V5a1 1 0 0 1 1-1h8v16"/><path d="M3 20h14"/></svg> Opening only</button>
      <div class="rmsep"></div>
      <button id="dmDelete" class="danger" role="menuitem"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg> Delete</button>
    </div>

    <div id="preview"><img id="prevImg" alt="floor plan"><img id="prevVec" alt="" aria-hidden="true">
      <div id="prevBar">
        <button class="pvb on" id="pvVec" type="button" title="Overlay" aria-label="Overlay" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="pvb" id="pvRevise" type="button" title="Revise" aria-label="Revise"><svg viewBox="0 0 24 24"><path d="M9.5 14.5 3 21"/><path d="M15 3l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/><path d="M18.5 13l.6 1.9 1.9.6-1.9.6-.6 1.9-.6-1.9-1.9-.6 1.9-.6z"/></svg></button>
      </div>
      <div id="prevStale"><span>Stale</span><button id="pvUpdate" type="button">Update</button></div>
      <div id="scan"><div class="grid"></div><div class="beam"></div><div class="cap">Drawing your floor plan…</div></div>
    </div>
    <div id="msg"></div>
    <div id="revBox"><input id="revIn" type="text" maxlength="200" placeholder="What should change? e.g. add a hallway between the rooms"><button id="revGo">Revise</button></div>
    <div id="confirmCard"><div class="cc" role="alertdialog" aria-modal="true" aria-labelledby="ccT" aria-describedby="ccB"><div class="cct" id="ccT"></div><div class="ccb" id="ccB"></div><div class="cca"><button id="ccNo">Cancel</button><button id="ccOk">OK</button></div></div></div>

    <!-- Bottom-left contextual history — outside the toolbar; Undo appears after the first edit, Redo only when a redo exists. -->
    <div class="histctl" id="histCtl">
      <button class="hb" id="tUndo" title="Undo" aria-label="Undo" style="display:none"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg></button>
      <button class="hb" id="tRedo" title="Redo" aria-label="Redo" style="display:none"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h1"/></svg></button>
    </div>

    <div class="tbar" id="tbar">
      <!-- ONE compact drawing-mode selector (drop-up) — "What am I drawing?": Structure / Room / Area / Opening. Keeps the dock narrow. -->
      <div class="morewrap" id="modeWrap">
        <button class="segToggle" id="modeSel" aria-haspopup="true" aria-expanded="false" title="Drawing mode" aria-label="Drawing mode">
          <span id="modeToggleName">Structure</span>
          <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
        </button>
        <div class="moremenu" id="modeMenu" role="menu">
          <button data-m="structure" role="menuitemradio"><svg class="mchk" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg> Structure</button>
          <button data-m="room" role="menuitemradio"><svg class="mchk" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg> Room</button>
          <button data-m="zone" role="menuitemradio"><svg class="mchk" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg> Area</button>
          <button data-m="opening" role="menuitemradio"><svg class="mchk" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg> Opening</button>
        </div>
      </div>
      <span id="structTools" class="stools">
        <button class="tb ico on" id="tAdd" title="Add" aria-label="Add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="tb ico" id="tErase" title="Erase" aria-label="Erase"><svg viewBox="0 0 24 24"><path d="M4 15l6-6 8 8H7z"/><path d="M9 10l6-6 5 5-6 6"/><path d="M4 21h16"/></svg></button>
        <button class="tb ico snap on" id="tSnap" title="Snap: half grid" aria-label="Snap: half grid">½</button>
        <button class="tb ico" id="tAerial" title="Aerial" aria-label="Aerial backdrop" style="display:none"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="8.5" cy="9" r="1.5"/></svg></button>
        <select id="zoneTypeSel" title="Area type" aria-label="Area type" style="display:none;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:600 13px var(--sans);padding:0 8px;cursor:pointer"></select>
      </span>
      <div class="morewrap">
        <button class="tb ico" id="tMore" title="More" aria-label="More"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
        <div class="moremenu" id="moreMenu">
          <button id="mClean"><svg viewBox="0 0 24 24"><path d="M9.5 14.5 3 21"/><path d="M15 3l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/><path d="M18.5 13l.6 1.9 1.9.6-1.9.6-.6 1.9-.6-1.9-1.9-.6 1.9-.6z"/></svg> <span id="mCleanTxt">Enhance</span></button>
          <button id="mExport"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg> Export</button>

    if(live) r.forEach(function(f){ var b=document.createElement("button"); b.type="button"; b.setAttribute("role","option"); b.setAttribute("aria-selected",f.cur?"true":"false"); b.textContent=f.name; b.disabled=f.cur; b.setAttribute("data-i",String(f.i));
      b.addEventListener("click", function(){ pickFloor(f.i); }); menu.appendChild(b); });
    $("floorSel").classList.add("on"); }
  function pickFloor(i){ closeFloorMenu();
    if(busy || $("confirmCard").classList.contains("on") || $("preview").classList.contains("show")) return;   // mid-Enhance / mid-confirm: don't yank the editor
    closeLabel(); flushPlan();   // commit a half-typed room name, then force the unsent plan to the host NOW: postMessage is ordered, so iotPlanSave lands before iotDrawFloor
    try{ parent.postMessage({type:"iotDrawFloor", i:i}, "*"); }catch(e){} }
  $("floorBtn").addEventListener("click", function(e){ e.stopPropagation(); if($("floorBtn").disabled) return; closeMore();
    var on=!$("floorMenu").classList.contains("on"); $("floorMenu").classList.toggle("on", on); $("floorBtn").setAttribute("aria-expanded", on?"true":"false"); });
  document.addEventListener("click", function(e){ if(!$("floorSel").contains(e.target)) closeFloorMenu(); });
  window.addEventListener("message", function(ev){ var m=ev.data; if(!m||m.type!=="iotFloors"||window.parent===window||ev.source!==parent) return;   // only the hosting survey speaks this
    _floors=floorRoster(m.floors, FID, _flIdx); renderFloorSel(); });
  renderFloorSel();
  $("mClean").addEventListener("click", function(){ if(busy) return; closeMore();   // the ONLY auto-less gate on /api/enhance
    if(!enhancedURL || enhanceStale()){ enhance(""); return; }   // first generation OR explicit Update for changed geometry (the only fetches)
    showEnhanced(); });                                          // fresh cached raster → reuse, NO re-fetch (unchanged plan never re-billed)
  $("mExport").addEventListener("click", function(){ closeMore(); var url=enhancedURL || sketchPNG().toDataURL("image/png");
    var a=document.createElement("a"); a.href=url; a.download="floor-plan.png"; a.click(); });
  // Import zones: rasterise the survey's legacy polygon boundary/zones into editable cells (undo-able).
  $("mImportZones").addEventListener("click", function(){ if(busy) return; closeMore(); backToDraw();
    if(importZonePolys()){ msg("Areas imported as cells — refine with Add / Erase."); setTimeout(function(){msg("");},2600); }
    else { msg("No survey zones to import for this floor."); setTimeout(function(){msg("");},2200); }
    updateImportZonesBtn(); });
  // Delete — two-tap confirm inside the menu (destructive, infrequent).
  $("mDelete").addEventListener("click", function(){ if(busy) return; var t=$("mDeleteTxt");
    if(t.textContent!=="Confirm delete"){ t.textContent="Confirm delete"; return; }
    cells=new Set(); rooms=[]; sel=null; draft=null; enhancedURL=null; enhancedRev=null; enhancedOnce=false;
    $("preview").classList.remove("show"); $("prevVec").classList.remove("on"); $("prevStale").classList.remove("on"); closeLabel(); closeMore(); pushHist(); setMode("structure"); });
  // Done → hand the final plan (enhanced if made, else the sketch) to the survey; it drops it as the
  // floor background AND saves it to the shared library (same contract the satellite tool uses).
  // Real-world size (feet) of the EXPORTED image — the plan bbox + the same ~6% margin sketchPNG/SVG use —
  // so the survey can scale coverage (camera throw, speaker radius) to real feet. Omitted when unscaled.
  function planFeet(){ if(!(metersPerPx>0)) return null;
    var arr=planCells(); if(!arr.length) return null; var bb=cellsBBoxPx(arr);
    var m=Math.max(HALF, Math.round(Math.max(bb.w,bb.h)*0.06));
    return { ftW:+pxToFeet(bb.w+2*m).toFixed(2), ftH:+pxToFeet(bb.h+2*m).toFixed(2) }; }
  $("tDone").addEventListener("click", function(){ if(busy||planState!=="loaded") return;
    if(!hasSketch()){ msg("Block out the structure, then rooms — or use the wand first."); setTimeout(function(){msg("");},2200); return; }
    closeLabel(); clearTimeout(_planT); _planT=null; writeLS(); postPlan();   // always: the floor record holds the final geometry BEFORE the result lands
    var scale=planFeet();
    // Enhanced (AI) plans are raster PNGs; a hand-drawn plan is handed back as VECTOR SVG so it stays crisp
    // at any zoom in the survey (no rasterization on the display path).
    if(enhancedURL){ try{ parent.postMessage({type:"satellite-capture-result", dataUrl:enhancedURL, scale:scale}, "*"); }catch(e){} }
    else { var vb=ctxVB();   // outlined floor → the bg is the OPAQUE plan framed on the ctx plate (flagged bgCtx) so Plan/customer/PDF surfaces align with the aerial; plain hand-drawn keeps the tight bbox bg
      if(vb){ try{ parent.postMessage({type:"satellite-capture-result", dataUrl:sketchSVG(vb), vector:true, scale:scale, planSvg:planLayerSVG(), bgCtx:true}, "*"); }catch(e){} }
      else { try{ parent.postMessage({type:"satellite-capture-result", dataUrl:sketchSVG(), vector:true, scale:scale, planSvg:planLayerSVG()}, "*"); }catch(e){} } } });
    // planSvg (Phase 4 layer) rides the vector hand-off only — an AI-enhanced result carries none, so the survey stores null (never a stale layer).

  // ---- Satellite trace handoff: a building outline (fractions of the aerial + aspect ratio) seeds the
  // Structure as occupied cells — the SAME canonical model as hand-drawing, just another creation
  // method. The seed snaps to whole boxes (each stored as its 4 half-cells). Shape + ratio preserved
  // (x scaled by aspect), fit-to-canvas with padding, centered.
  function pointInPoly(x,y,poly){ var inside=false,n=poly.length; for(var i=0,j=n-1;i<n;j=i++){ var xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y; if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/((yj-yi)||1e-9)+xi)) inside=!inside; } return inside; }
  function outlineToCells(pts, aspect){
    aspect=(+aspect>0)?+aspect:1; var W0=W(), H0=H(); if(!W0||!H0||!pts||pts.length<3) return null;
    var wp=pts.map(function(p){ return {x:(+p[0])*aspect, y:(+p[1])}; });
    var xs=wp.map(function(p){return p.x;}), ys=wp.map(function(p){return p.y;});
    var mnx=Math.min.apply(null,xs), mxx=Math.max.apply(null,xs), mny=Math.min.apply(null,ys), mxy=Math.max.apply(null,ys);
    var bw=Math.max(1e-6,mxx-mnx), bh=Math.max(1e-6,mxy-mny), pad=0.14;
    var sc=Math.min((W0*(1-2*pad))/bw, (H0*(1-2*pad))/bh);
    _seedSc=sc;                                        // canvas px per world unit — lets the seed resolve real scale
    var offx=(W0-bw*sc)/2 - mnx*sc, offy=(H0-bh*sc)/2 - mny*sc;
    _seed={ sc:sc, offx:offx, offy:offy, aspect:aspect };   // plan px = canvas px (cells are absolute "c,r" × HALF) → valid at any later canvas size
    var poly=wp.map(function(p){ return {x:p.x*sc+offx, y:p.y*sc+offy}; });
    var pxs=poly.map(function(p){return p.x;}), pys=poly.map(function(p){return p.y;});
    // Rasterise on the FULL-box grid (not half-cells): the seed snaps to whole boxes — a full box is
    // "in" when its centre is inside the outline, and it fills all four of its half-cells.
    var fc0=Math.floor(Math.min.apply(null,pxs)/FULL), fc1=Math.ceil(Math.max.apply(null,pxs)/FULL);
    var fr0=Math.floor(Math.min.apply(null,pys)/FULL), fr1=Math.ceil(Math.max.apply(null,pys)/FULL);
    var out=new Set();
    for(var fc=fc0;fc<=fc1;fc++) for(var fr=fr0;fr<=fr1;fr++){
      if(pointInPoly(fc*FULL+FULL/2, fr*FULL+FULL/2, poly)){
        var hc=fc*2, hr=fr*2;
        out.add(hc+","+hr); out.add((hc+1)+","+hr); out.add(hc+","+(hr+1)); out.add((hc+1)+","+(hr+1));
      }
    }
    return out;
  }
  // Phase 3c: migrate the survey's legacy POLYGON boundary + zones (plate-% of the ctx plate) into zone
  // CELLS. INLINE copy of lib/zone-migrate.js (half-cell centre rasterisation) — tests/zone-migrate-drift
  // keeps the two identical. Plate-% → plan-px through ctxVB (the same transform the plan layer uses).
  var _zonePolys=null;   // {boundary:{pts}, zones:[{type,pts}]} in plate-%, from the survey
  function polyPctToPlanPx(pts, vb){ return pts.map(function(p){ var px=(p[0]!=null?+p[0]:+p.x), py=(p[1]!=null?+p[1]:+p.y); return {x:vb.x0+px/100*vb.vw, y:vb.y0+py/100*vb.vh}; }); }
  function rasterPolyToHalfCells(pts, vb){ if(!vb||!(+vb.vw>0)||!(+vb.vh>0)||!pts||pts.length<3) return [];
    var poly=polyPctToPlanPx(pts, vb), pxs=poly.map(function(p){return p.x;}), pys=poly.map(function(p){return p.y;});
    var c0=Math.floor(Math.min.apply(null,pxs)/HALF), c1=Math.ceil(Math.max.apply(null,pxs)/HALF), r0=Math.floor(Math.min.apply(null,pys)/HALF), r1=Math.ceil(Math.max.apply(null,pys)/HALF), out=[], lim=20000;
    for(var r=r0;r<=r1;r++) for(var c=c0;c<=c1;c++){ if(out.length>=lim) return out; if(pointInPoly(c*HALF+HALF/2, r*HALF+HALF/2, poly)) out.push(c+","+r); } return out; }
  function importableZones(){ return !!(_zonePolys && ctxVB() && ((_zonePolys.boundary&&_zonePolys.boundary.pts&&_zonePolys.boundary.pts.length>=3) || (_zonePolys.zones&&_zonePolys.zones.length))); }
  function importZonePolys(){ var vb=ctxVB(); if(!_zonePolys||!vb) return false;
    var owner={}; function paint(pts,type){ rasterPolyToHalfCells(pts,vb).forEach(function(k){ owner[k]=type; }); }   // boundary first (site base), zones override — one class per cell
    if(_zonePolys.boundary && _zonePolys.boundary.pts) paint(_zonePolys.boundary.pts, "site");
    (_zonePolys.zones||[]).forEach(function(z){ if(z&&z.pts&&z.type&&ZCOL[z.type]) paint(z.pts, z.type); });
    var any=false; for(var k in owner){ zcGet(owner[k]).add(k); any=true; }
    if(any){ setMode("zone"); pushHist(); redraw(); try{ parent.postMessage({type:"iotZonesMigrated", project:PID, fid:FID}, "*"); }catch(e){} } return any; }
  function updateImportZonesBtn(){ var b=$("mImportZones"); if(b) b.style.display = importableZones() ? "flex" : "none"; }

  try{ if(localStorage.getItem("iot_struct_snap")==="1") snap=1; }catch(e){}   // remembered snap (default ½)
  applySnapUI();
  fitCanvas();                                       // size the canvas first → W()/H() valid for migration + trace seed
  // Geometry resolves ONCE (host plan / legacy import / standalone), THEN the trace seed applies on top, then
  // history + mode. Until then the canvas stays a neutral blank (no "block out" prompt, input ignored).
  var _seeded=false, _planTO=null, _lateOK=false;
  // In-product confirm (replaces window.confirm): askConfirm({title,body,ok,danger}, onYes, onNo) — exactly one callback fires, once.
  // Esc / backdrop = No; while open, keys never reach the editor shortcuts (undo etc.).
  var _cc=null;
  function closeConfirm(yes){ var c=_cc; if(!c) return; _cc=null; $("confirmCard").classList.remove("on"); var f=yes?c.yes:c.no; if(f) f(); }
  function askConfirm(o, onYes, onNo){ if(_cc) closeConfirm(false); o=o||{}; $("ccT").textContent=o.title||"Confirm"; $("ccB").textContent=o.body||""; $("ccB").style.display=o.body?"":"none";
    var ok=$("ccOk"); ok.textContent=o.ok||"OK"; ok.className=o.danger?"danger":""; _cc={yes:onYes,no:onNo}; $("confirmCard").classList.add("on");
    try{ (o.danger?$("ccNo"):ok).focus(); }catch(e){} }
  $("ccOk").addEventListener("click", function(){ closeConfirm(true); });
  $("ccNo").addEventListener("click", function(){ closeConfirm(false); });
  $("confirmCard").addEventListener("click", function(e){ if(e.target===this) closeConfirm(false); });
  document.addEventListener("keydown", function(e){ if(!_cc) return; e.stopPropagation(); if(e.key==="Escape"){ e.preventDefault(); closeConfirm(false); } }, true);
  function initWithPlan(plan, migrated, fromKey){ if(planState==="loaded") return; planState="loaded"; clearTimeout(_planTO);
    applyPlan(plan);
    // Everything after the (optional) seed choice — runs exactly once, on whatever geometry resulted (seeded, or the loaded plan on No / no seed).
    function finish(){
      if(_seeded){ snap=1; applySnapUI(); }           // seed is box-aligned → continue editing on the full-box grid
      reconcileRooms();                              // migrate legacy rect rooms + clip every room to the structure
      hist=[snapshot()]; hi=0;                       // baseline history on the reconciled (or seeded) state
      setMode(_seeded ? "structure" : (cells.size ? "room" : "structure"));   // seeded → land in Structure to refine the shell
      writeLS();                                     // recovery copy now mirrors the resolved geometry (overwrite, never merge)
      if(fromKey===LSK_OLD && LSK_OLD && LSK_OLD!==LSK && hasPlan(readLS(LSK))){ try{ localStorage.removeItem(LSK_OLD); }catch(e){} }   // legacy draft now lives under the fid key → never imported twice
      if(_seeded || migrated){ persist(); flushPlan(); }   // seeded / imported legacy draft → create the floor's server copy now
      updateTools(); updateAerialBtn(); updateImportZonesBtn(); redraw(); }   // geometry + its seed transform resolved → the aerial backdrop + zone-import can position / show
    var raw=_qs.get("seed"), S=null; if(raw){ try{ S=JSON.parse(decodeURIComponent(raw)); }catch(e){} }
    if(!S||!S.pts||S.pts.length<3){ finish(); return; }
    function seed(){ var prevSeed=_seed, out=outlineToCells(S.pts, S.aspect); if(out && out.size){
        if(S.base){ zoneCells={ site:out }; cells=new Set(); rooms=[]; }   // Define Project Base: the polygon is the WORKING AREA → fill it as Site cells (grid extent set by the seed); Building is painted in Setup
        else { cells=out; rooms=[]; }
        _seeded=true;
        if(+S.metersPerUnit>0 && _seedSc>0) metersPerPx = (+S.metersPerUnit)/_seedSc;   // real scale from the aerial
      } else _seed=prevSeed;   // nothing seeded → the loaded plan's transform still describes its geometry
      finish(); }
    if(cells.size) askConfirm({title:"Replace structure?", body:"This floor already has a structure. The traced outline will replace it.", ok:"Replace"}, seed, finish);   // never silently overwrite; No keeps the structure
    else seed(); }
  // Host reply: a non-null plan is authoritative (even an empty one) — unless this floor's recovery copy holds
  // edits made after it (crash before the survey got them). null → import a local draft once, else empty.
  window.addEventListener("message", function(ev){ var m=ev.data; if(!m||m.type!=="iotPlanLoad"||m.fid!==FID) return;
    var p=(m.plan && typeof m.plan==="object") ? m.plan : null;
    if(planState==="loaded"){                        // reply after the fallback: never dropped silently
      if(!_lateOK || !p || _qs.get("seed")) return; _lateOK=false;
      var accept=function(){ applyPlan(p); reconcileRooms(); hist=[snapshot()]; hi=0; setMode(cells.size?"room":"structure"); writeLS();
        clearTimeout(_planT); postPlan(); };         // hand it back: any edit/undo already posted must not stand in for it
      if(hi>0){ if(!hasPlan(p)) return;              // edits vs an empty server plan → nothing to lose
        askConfirm({title:"Replace changes?", body:"A saved plan for this floor exists on the server. It will replace your current changes.", ok:"Replace"}, accept, function(){ persist(); flushPlan(); });   // No = keep local → replace the server copy deliberately
        return; }
      accept(); return; }
    if(p){ var lc=readLS(LSK); if(hasPlan(p) && hasPlan(lc) && (+lc.t||0) > (+p.t||0)+1500){ initWithPlan(lc, true); return; }   // unsent local edits win, and are posted
      initWithPlan(p, false); return; }
    var lp=localPlan(); initWithPlan(lp, !!lp, _lpKey); });
  // Phase 2 (grid-first): the host hands this floor's enhanced/leveled aerial to paint Building cells on the roof.
  window.addEventListener("message", function(ev){ var m=ev.data; if(!m||m.type!=="iotDrawBackdrop"||m.fid!==FID) return;
    if(!m.src || typeof m.src!=="string"){ _bdImg=null; updateAerialBtn(); redraw(); return; }
    var img=new Image(); img.onload=function(){ _bdImg=img; updateAerialBtn(); redraw(); }; img.onerror=function(){ _bdImg=null; updateAerialBtn(); }; img.src=m.src; });
  // Phase 3c: the survey hands over its legacy polygon boundary + zones so they can be migrated to cells.
  window.addEventListener("message", function(ev){ var m=ev.data; if(!m||m.type!=="iotZonePolys"||m.fid!==FID) return;
    _zonePolys = (m.boundary||m.zones) ? { boundary:(m.boundary&&m.boundary.pts)?{pts:m.boundary.pts}:null, zones:Array.isArray(m.zones)?m.zones:[] } : null;
    updateImportZonesBtn(); });
  if(window.parent===window){ var lp0=localPlan(); initWithPlan(lp0, false, _lpKey); }   // standalone / dev: localStorage as before
  else {
    // Silent/slow host: a local copy → use it at 800 ms. Nothing local → keep the canvas blocked ("Loading plan…")
    // up to 6 s total before starting empty, so an empty sketch can't race ahead of (and later replace) the real plan.
    _planTO=setTimeout(function(){ var lp=localPlan(); if(lp){ _lateOK=true; initWithPlan(lp, false, _lpKey); return; }
      $("hint").textContent="Loading plan…"; $("hint").style.display="block";
      _planTO=setTimeout(function(){ _lateOK=true; initWithPlan(null, false); }, 5200); }, 800);
    try{ parent.postMessage({type:"iotPlanReady", project:PID, fid:FID}, "*"); }catch(e){ var lp1=localPlan(); initWithPlan(lp1, false, _lpKey); }
  }
</script>
