<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Draw floor plan</title>
<style>
  :root{color-scheme:light;--ink:#101112;--muted:#6b7076;--line:#e3e5e8;--soft:#f6f7f8;--gold:#b98a2e;--r:10px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font:15px/1.45 var(--sans);color:var(--ink);background:#fff;display:flex;flex-direction:column;overflow:hidden}

  .stage{flex:1;position:relative;min-height:0;background:#fbfbfa;overflow:hidden}
  #grid{position:absolute;inset:0;background-image:linear-gradient(#eceae4 1px,transparent 1px),linear-gradient(90deg,#eceae4 1px,transparent 1px);background-size:26px 26px;pointer-events:none}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  #hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:calc(100vw - 120px);text-align:center;color:var(--muted);font-size:12.5px;pointer-events:none;z-index:2;
    background:rgba(251,251,250,.86);padding:4px 12px;border-radius:99px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  #hint b{color:var(--ink)}
  @media(max-width:640px){ #hint{top:54px;max-width:calc(100vw - 32px)} #homeLogo{opacity:.5;transform:scale(.85);transform-origin:top left} }

  /* label popover for the selected shape */
  /* Compact intelligent room-name combobox — input is the primary control; ≤5 ranked suggestions. */
  /* Floor selector: top-left, to the right of the home logo (the corner is taken); outside the bottom dock. */
  #floorSel{position:absolute;top:12px;left:152px;z-index:20;display:none}
  #floorSel.on{display:block}
  #floorBtn{display:inline-flex;align-items:center;gap:6px;height:28px;max-width:44vw;padding:0 9px 0 11px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.85);color:var(--ink);font:600 12.5px var(--sans);cursor:pointer;backdrop-filter:blur(4px)}
  #floorBtn:hover{border-color:var(--ink)} #floorBtn:disabled{cursor:default;border-color:var(--line)}
  #floorName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #floorBtn svg{width:13px;height:13px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #floorMenu{position:absolute;top:calc(100% + 6px);left:0;display:none;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(16,17,18,.22);padding:6px;min-width:150px;max-width:min(240px,calc(100vw - 24px));max-height:50vh;overflow:auto}
  #floorMenu.on{display:flex}
  #floorMenu button{display:block;border:0;background:transparent;color:var(--ink);font:600 13px var(--sans);padding:9px 12px;border-radius:9px;cursor:pointer;text-align:left;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #floorMenu button:hover:not(:disabled),#floorMenu button:focus-visible{background:var(--soft);outline:none}
  #floorMenu button:disabled{opacity:.4;cursor:default}
  #labelPop{position:absolute;z-index:9;display:none;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(16,17,18,.24);padding:6px;width:248px;max-width:calc(100vw - 24px)}
  #labelPop.on{display:flex}
  #labelPop input{width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:9px 10px;font:inherit;font-size:15px;font-weight:600;outline:none;color:var(--ink);background:var(--soft)}
  #labelPop input::placeholder{color:#9aa0a6;font-weight:500}
  #labelPop .lprow{display:flex;align-items:center;gap:6px}
  #labelPop .lprow input{flex:1 1 auto;width:auto}
  #labelPop .lpact{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:0;border-radius:8px;background:var(--soft);color:var(--ink);cursor:pointer;padding:0}
  #labelPop .lpact svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  #labelPop .lpact:hover{background:#eceef0}
  #labelPop #lpDel{color:#c4553d}
  #labelPop #lpDel.arm{background:#c4553d;color:#fff}
  #labelPop .lplist{display:flex;flex-direction:column;margin-top:4px}
  #labelPop .lplist:empty{margin-top:0}
  #labelPop .lpopt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #labelPop .lpopt:hover,#labelPop .lpopt.active{background:var(--soft)}
  #labelPop .lpopt.custom{color:var(--gold);font-weight:600}
  #labelPop .lpopt .lpk{margin-left:auto;font-size:11px;color:#9aa0a6;font-weight:600}

  #preview{position:absolute;inset:0;background:#fff;display:none;z-index:9}
  #preview.show{display:block}
  #prevImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  /* Canonical vectors re-drawn OVER the AI raster — same tight bbox+margin frame, same object-fit:contain, so walls/labels/doors land 1:1 on the PNG (proves the AI moved nothing). */
  #prevVec{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;display:none}
  #prevVec.on{display:block}
  #prevBar{position:absolute;top:12px;right:12px;z-index:11;display:flex;gap:8px}
  .pvb{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.95);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(16,17,18,.14);backdrop-filter:blur(4px)}
  .pvb:hover{border-color:var(--ink)} .pvb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pvb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  /* STALE badge + explicit Update — the geometry changed since the raster was made; never auto-regenerated. */
  #prevStale{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:11;display:none;align-items:center;gap:8px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:10px;padding:5px 6px 5px 11px;box-shadow:0 6px 22px rgba(16,17,18,.2)}
  #prevStale.on{display:flex}
  #prevStale span{font:700 12px var(--sans);color:#c4553d}
  #prevStale button{border:0;background:var(--gold);color:#fff;border-radius:8px;padding:7px 12px;font:700 12.5px var(--sans);cursor:pointer}
  #scan{position:absolute;inset:0;z-index:10;display:none;overflow:hidden;background:rgba(12,14,16,.28)}
  #scan.on{display:block}
  #scan .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(185,138,46,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(185,138,46,.16) 1px,transparent 1px);background-size:28px 28px;-webkit-mask:radial-gradient(circle at 50% 45%,#000,transparent 78%);mask:radial-gradient(circle at 50% 45%,#000,transparent 78%);animation:gp 1.7s ease-in-out infinite}
  @keyframes gp{0%,100%{opacity:.28}50%{opacity:.6}}
  #scan .beam{position:absolute;left:0;right:0;height:42%;top:-42%;background:linear-gradient(180deg,transparent,rgba(185,138,46,.2) 55%,rgba(255,240,205,.55) 92%,rgba(255,255,255,.9));box-shadow:0 0 30px 8px rgba(185,138,46,.35);animation:sm 1.5s cubic-bezier(.55,0,.45,1) infinite}
  @keyframes sm{0%{top:-42%}100%{top:100%}}
  #scan .cap{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.55)}
  #msg{position:absolute;left:0;right:0;bottom:70px;text-align:center;color:var(--muted);font-size:12.5px;z-index:11;display:none}
  #msg.on{display:block}
  #revBox{position:absolute;left:50%;transform:translateX(-50%);bottom:70px;z-index:12;display:none;gap:8px;align-items:center;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:10px;padding:7px 8px 7px 12px;box-shadow:0 6px 22px rgba(16,17,18,.2)}
  #revBox.on{display:flex}
  #revBox input{border:0;outline:none;font:inherit;font-size:13px;color:var(--ink);width:min(52vw,320px)}
  #revBox button{border:0;background:var(--gold);color:#fff;border-radius:8px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer}
  /* In-product confirm (replaces window.confirm): compact centered card over a light dim; Cancel quiet, one primary. */
  #confirmCard{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(16,17,18,.28);padding:16px}
  #confirmCard.on{display:flex}
  #confirmCard .cc{width:min(300px,100%);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(16,17,18,.24);padding:14px}
  #confirmCard .cct{font-size:14px;font-weight:700;color:var(--ink)}
  #confirmCard .ccb{margin-top:4px;font-size:12.5px;color:var(--muted)}
  #confirmCard .cca{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  #confirmCard button{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:600 13px var(--sans);cursor:pointer}
  #confirmCard button#ccOk{background:var(--ink);border-color:var(--ink);color:#fff}
  #confirmCard button#ccOk.danger{background:#c4553d;border-color:#c4553d}

  /* One compact bottom dock — a single row, never wraps: [Structure|Room] [+][Erase][snap] [•••] [Done]. */
  .tbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:14;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;max-width:calc(100vw - 16px);
    background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 8px 30px rgba(16,17,18,.2);backdrop-filter:blur(8px)}
  .seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:2px;flex:none}
  .segb{border:0;background:transparent;color:var(--ink);font:600 13px var(--sans);padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .segb.on{background:var(--ink);color:#fff}
  .segb.locked{opacity:.4;pointer-events:none}
  .segToggle{display:none;align-items:center;gap:8px;height:40px;padding:0 12px;border:0;border-radius:11px;background:var(--ink);color:#fff;font:600 13px var(--sans);cursor:pointer;flex:none;white-space:nowrap}
  .segToggle svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
  .stools{display:inline-flex;align-items:center;gap:6px}
  .tb{display:flex;align-items:center;gap:7px;height:40px;padding:0 13px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);font:600 13px var(--sans);cursor:pointer}
  .tb.ico{width:40px;padding:0;justify-content:center}
  .tb.snap{font-weight:800;font-size:15px}
  .tb.ico.on{background:var(--ink);color:#fff}
  .tb.ico.locked{opacity:.4;pointer-events:none}
  .tb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tb:hover{background:var(--soft)}
  .tb.ico.on:hover{background:#000}
  .tb.use{background:var(--ink);color:#fff;border-color:var(--ink);padding:0 18px;flex:none}
  .tb.use:hover{background:#000}
  .tb:disabled{opacity:.4;cursor:default}
  .tb.busy{opacity:.5;pointer-events:none}
  .morewrap{position:relative;display:inline-flex}
  .moremenu{position:absolute;bottom:calc(100% + 8px);right:0;display:none;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(16,17,18,.22);padding:6px;min-width:184px}
  .moremenu.on{display:flex}
  .moremenu button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--ink);font:600 13px var(--sans);padding:11px 12px;border-radius:9px;cursor:pointer;text-align:left;width:100%}
  .moremenu button:hover{background:var(--soft)}
  .moremenu button.danger{color:#c4553d}
  .moremenu button.busy{opacity:.5;pointer-events:none}
  .moremenu svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .moremenu #mClean svg{stroke:var(--gold)}
  /* Bottom-left canvas history controls */
  .histctl{position:absolute;left:14px;bottom:14px;z-index:14;display:flex;gap:8px}
  .hb{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.95);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(16,17,18,.14);backdrop-filter:blur(4px)}
  .hb:hover{border-color:var(--ink)}
  .hb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  @media(max-width:640px){
    .tbar{left:8px;right:8px;transform:none;max-width:none;bottom:calc(10px + env(safe-area-inset-bottom));gap:6px;justify-content:space-between}
    .segb{padding:9px 11px}
    .tb.ico{width:44px;height:44px}
    .tb.use{height:44px;padding:0 16px}
    .stools{gap:5px}
    .histctl{left:10px;bottom:calc(78px + env(safe-area-inset-bottom))}
    .hb{width:44px;height:44px}
  }
  @media(max-width:410px){ #modeSeg{display:none} .segToggle{display:inline-flex} }
  @media(max-width:400px){ .tbar{gap:4px} .tb.ico{width:38px} .tb.use{padding:0 12px} .stools{gap:4px} .segToggle{padding:0 11px;gap:6px} }
</style>
<style id="ios-zoom-fix">/* BUG #42: iOS zooms + shifts the page when a focused field is under 16px. Keep tapping a text box from moving the screen on iPhone. */
@media (max-width:640px){input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]),select,textarea,[contenteditable]{font-size:16px!important}}</style>

        if(+S.metersPerUnit>0 && _seedSc>0) metersPerPx = (+S.metersPerUnit)/_seedSc;   // real scale from the aerial
      } else _seed=prevSeed;   // nothing seeded → the loaded plan's transform still describes its geometry
      finish(); }
    if(cells.size) askConfirm({title:"Replace structure?", body:"This floor already has a structure. The traced outline will replace it.", ok:"Replace"}, seed, finish);   // never silently overwrite; No keeps the structure
    else seed(); }
  // Host reply: a non-null plan is authoritative (even an empty one) — unless this floor's recovery copy holds
  // edits made after it (crash before the survey got them). null → import a local draft once, else empty.
  window.addEventListener("message", function(ev){ var m=ev.data; if(!m||m.type!=="iotPlanLoad"||m.fid!==FID) return;
    var p=(m.plan && typeof m.plan==="object") ? m.plan : null;
    if(planState==="loaded"){                        // reply after the fallback: never dropped silently
      if(!_lateOK || !p || _qs.get("seed")) return; _lateOK=false;
      var accept=function(){ applyPlan(p); reconcileRooms(); hist=[snapshot()]; hi=0; setMode(cells.size?"room":"structure"); writeLS();
        clearTimeout(_planT); postPlan(); };         // hand it back: any edit/undo already posted must not stand in for it
      if(hi>0){ if(!hasPlan(p)) return;              // edits vs an empty server plan → nothing to lose
        askConfirm({title:"Replace changes?", body:"A saved plan for this floor exists on the server. It will replace your current changes.", ok:"Replace"}, accept, function(){ persist(); flushPlan(); });   // No = keep local → replace the server copy deliberately
        return; }
      accept(); return; }
    if(p){ var lc=readLS(LSK); if(hasPlan(p) && hasPlan(lc) && (+lc.t||0) > (+p.t||0)+1500){ initWithPlan(lc, true); return; }   // unsent local edits win, and are posted
      initWithPlan(p, false); return; }
    var lp=localPlan(); initWithPlan(lp, !!lp, _lpKey); });
  // Phase 2 (grid-first): the host hands this floor's enhanced/leveled aerial to paint Building cells on the roof.
  window.addEventListener("message", function(ev){ var m=ev.data; if(!m||m.type!=="iotDrawBackdrop"||m.fid!==FID) return;
    if(!m.src || typeof m.src!=="string"){ _bdImg=null; updateAerialBtn(); redraw(); return; }
    var img=new Image(); img.onload=function(){ _bdImg=img; updateAerialBtn(); redraw(); }; img.onerror=function(){ _bdImg=null; updateAerialBtn(); }; img.src=m.src; });
  // Phase 3c: the survey hands over its legacy polygon boundary + zones so they can be migrated to cells.
  window.addEventListener("message", function(ev){ var m=ev.data; if(!m||m.type!=="iotZonePolys"||m.fid!==FID) return;
    _zonePolys = (m.boundary||m.zones) ? { boundary:(m.boundary&&m.boundary.pts)?{pts:m.boundary.pts}:null, zones:Array.isArray(m.zones)?m.zones:[] } : null;
    updateImportZonesBtn(); });
  if(window.parent===window){ var lp0=localPlan(); initWithPlan(lp0, false, _lpKey); }   // standalone / dev: localStorage as before
  else {
    // Silent/slow host: a local copy → use it at 800 ms. Nothing local → keep the canvas blocked ("Loading plan…")
    // up to 6 s total before starting empty, so an empty sketch can't race ahead of (and later replace) the real plan.
    _planTO=setTimeout(function(){ var lp=localPlan(); if(lp){ _lateOK=true; initWithPlan(lp, false, _lpKey); return; }
      $("hint").textContent="Loading plan…"; $("hint").style.display="block";
      _planTO=setTimeout(function(){ _lateOK=true; initWithPlan(null, false); }, 5200); }, 800);
    try{ parent.postMessage({type:"iotPlanReady", project:PID, fid:FID}, "*"); }catch(e){ var lp1=localPlan(); initWithPlan(lp1, false, _lpKey); }
  }
</script>
