    function siProbe(){ if(siProbed||RO||frozen()) return; siProbed=true;
      try{ fetch("/api/site-intel?probe=1",{credentials:"same-origin"}).then(function(r){ return r.ok?r.json():null; }).then(function(j){ siteIntelOK=!!(j&&j.ok&&j.configured); siUpdateUI(); }).catch(function(){}); }catch(e){} }
    function siActive(){ var f=floors[curFloor]; return !!(siteIntelOK && !siGone && PID && hybridCapable(f) && !frozen()); }
    function siUpdateUI(){ siProbe(); var b=document.getElementById("siBtn"); if(b){ b.style.display=siActive()?"":"none"; b.disabled=!!siBusy; b.classList.toggle("on",!!siBusy); } }
    // Draft items for the current floor: boundary / zones (plate-% polygons) / sides — one list drives the preview, the panel and Apply.
    function siItems(d,f){ var out=[], p=d&&d.payload, rect=siRect(f); if(!p) return out;
      if(p.siteBoundary&&p.siteBoundary.polygon){ var bp=siMapPoly(p.siteBoundary.polygon,rect); if(bp.length>=3) out.push({ id:"b", kind:"boundary", label:"Boundary", conf:+p.siteBoundary.confidence||0, pts:bp }); }
      (Array.isArray(p.zones)?p.zones:[]).forEach(function(z,i){ var pp=siMapPoly(z&&z.polygon,rect); if(pp.length<3) return; var t=siZoneType(z.type); out.push({ id:"z"+i, kind:"zone", label:t.label||zTypeLabel(t.type), conf:+z.confidence||0, pts:pp, type:t.type, zlabel:t.label }); });
      siSides(p.orientation).forEach(function(s){ out.push({ id:"s"+s.side, kind:"side", label:SIDE_COMPASS[s.side]+" · "+s.label, conf:+(p.orientation&&p.orientation.confidence)||0, side:s.side, sideLabel:s.label, sideType:s.type }); });
      return out; }
    function siLayerEl(){ var ly=document.getElementById("siLayer"), sc=document.getElementById("scene"); if(!ly&&sc){ ly=document.createElementNS("http://www.w3.org/2000/svg","svg"); ly.setAttribute("id","siLayer"); ly.setAttribute("viewBox","0 0 100 100"); ly.setAttribute("preserveAspectRatio","none"); ly.setAttribute("aria-hidden","true"); sc.appendChild(ly); } return ly; }   // preview layer lives in #scene (rides zoom/pan), created on first render so the static plate markup is unchanged
    function siPct(c){ return Math.round(Math.max(0,Math.min(1,c))*100)+"%"; }
    function siRender(noChk){ var pn=document.getElementById("siPanel"), ly=siLayerEl(), f=floors[curFloor], mine=(siFloor===f)&&!frozen()&&hybridCapable(f), d=(mine&&siDraft&&siDraft.f===f)?siDraft:null, show=mine&&(siBusy||!!siErr||!!d), s="", h="";
      if(ly){ if(d){ siItems(d,f).forEach(function(it){ if(it.kind==="side"||d.off[it.id]) return; var col=(it.kind==="boundary")?"61,123,217":(ZONE_COLORS[it.type]||ZONE_COLORS.custom), op=(0.45+0.55*it.conf).toFixed(2);
          s+='<polygon points="'+boundaryToPath(it.pts)+'" fill="rgba('+col+',.12)" stroke="rgb('+col+')" stroke-width="1.6" stroke-dasharray="2 3" opacity="'+op+'" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>'; }); } ly.innerHTML=s; }
      if(!pn) return; pn.style.display=show?"block":"none"; if(!show){ pn.innerHTML=""; return; }
      var X='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>', RR='<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4"/></svg>';
      if(siBusy){ h='<div class="siMsg">Analyzing…</div>'; }
      else if(siErr){ h='<div class="siHd"><span>'+zEsc(siErr)+'</span><button class="siX" data-act="close" aria-label="Close">'+X+'</button></div>'+(siGone?'':'<div class="siFt"><button class="siB pri" data-act="retry">Retry</button></div>'); }
      else { var its=siItems(d,f), n=0; h='<div class="siHd"><span>Analysis</span>'+(d.stale?'<em class="siBadge" style="font-style:normal">Outdated</em>':'')+'<button class="siX" data-act="discard" aria-label="Discard">'+X+'</button></div>';
        its.forEach(function(it){ var on=!d.off[it.id]; if(on) n++; var col=(it.kind==="boundary")?"61,123,217":(it.kind==="side"?"140,146,150":(ZONE_COLORS[it.type]||ZONE_COLORS.custom));
          h+='<button class="siRow'+(on?' on':'')+'" data-act="tog" data-id="'+it.id+'" aria-pressed="'+(on?'true':'false')+'"><b><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></b><i style="background:rgb('+col+')"></i><span>'+zEsc(it.label)+'</span><em>'+siPct(it.conf)+'</em></button>'; });
        if(!its.length) h+='<div class="siMsg">Nothing found</div>';
        h+='<div class="siFt"><button class="siB pri" data-act="apply"'+((d.stale||!n)?' disabled':'')+'>Apply</button><button class="siB" data-act="discard">Discard</button><button class="siB" data-act="again" title="Again" aria-label="Analyze Again">'+RR+'</button></div>'; }
      pn.innerHTML=h; if(d && !noChk) siCheckStale(); }
    // Outdated = the context now hashes differently from the one this draft was analyzed on. Badge + Apply disabled; NEVER an automatic re-run.
    function siCheckStale(){ clearTimeout(siStT); var d=siDraft; if(!d) return; siStT=setTimeout(function(){ var f=d.f; if(siDraft!==d||floors.indexOf(f)<0) return;
      siteHash(siContext(f)).then(function(h){ var st=(h!==d.hash); if(siDraft===d && !!d.stale!==st){ d.stale=st; siRender(true); } }).catch(function(){}); },200); }
    function siDiscard(){ siDraft=null; siErr=""; siSeq++; siBusy=false; siUpdateUI(); siRender(true); }
    // THE only AI call: an explicit Analyze / Analyze Again tap lands here. No auto-retry; a 100s guard so it never spins forever.
    function siAnalyze(again){ if(siBusy||frozen()||!siteIntelOK||siGone) return; var f=floors[curFloor]; if(!siActive()) return;
      var ctx=siContext(f), seq=++siSeq, ac=(typeof AbortController!=="undefined")?new AbortController():null;
      siBusy=true; siErr=""; siDraft=null; siFloor=f; siUpdateUI(); siRender(true);
      var tm=setTimeout(function(){ if(ac) try{ ac.abort(); }catch(e){} fail(); },100000);
      function fail(){ if(seq!==siSeq||!siBusy) return; clearTimeout(tm); siBusy=false; siErr="Analysis failed"; siUpdateUI(); siRender(true); }
      siImageData(ctx.image,function(img){ if(seq!==siSeq) return; if(!img) return fail();
        siteHash(ctx).then(function(hash){ if(seq!==siSeq) return;
          var body={ accessId:PID, floorId:f.id||null, sourceHash:hash, image:img, grid:ctx.grid, transform:ctx.transform, north:ctx.north, structure:ctx.structure, metadata:ctx.metadata, zones:ctx.zones }; if(again) body.analyzeAgain=true;
          return fetch("/api/site-intel",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(body),signal:ac?ac.signal:undefined})
            .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(seq!==siSeq) return; clearTimeout(tm);
              if(r.status===503){ siGone=true; siBusy=false; siErr="AI not configured"; siUpdateUI(); siRender(true); return; }
              var run=j&&j.run, p=run&&run.payload;
              if(!r.ok||!j||!j.ok||!p||typeof p!=="object"||p.error){ fail(); return; }
              var off={}; if(f.boundary&&f.boundary.pts&&f.boundary.pts.length>=3) off.b=true; if(f.sides&&typeof f.sides==="object") ["top","right","bottom","left"].forEach(function(k){ if(f.sides[k]) off["s"+k]=true; });   // never default-replace what the user already set
              siBusy=false; siDraft={ f:f, hash:hash, payload:p, off:off, reused:!!j.reused, stale:false }; siUpdateUI(); siRender(); }); }); })
        .catch(function(){ fail(); }); }); }
    // Apply: the INCLUDED suggestions become ordinary canonical geometry (validated like hand-drawn), then the draft is dropped.
    function siApply(){ var d=siDraft; if(!d||frozen()||d.stale) return; var f=d.f; if(floors.indexOf(f)<0||f!==floors[curFloor]){ siDiscard(); return; }
      var zs=[], did=false;
      siItems(d,f).forEach(function(it){ if(d.off[it.id]) return;
        if(it.kind==="boundary"){ var b=bdValidBoundary({pts:it.pts}); if(b){ f.boundary=b; did=true; } }
        else if(it.kind==="zone") zs.push({ label:it.zlabel, type:it.type, pts:it.pts });
        else if(it.kind==="side"){ f.sides=sidesOf(f); f.sides[it.side]={ label:it.sideLabel, type:it.sideType }; did=true; } });
      if(zs.length){ var before=Array.isArray(f.zones)?f.zones:[], merged=zValidZones(before.concat(zs)); if(merged.length>before.length){ f.zones=merged; did=true; } }
      siDraft=null; siErr=""; if(did){ bdLoad(); renderView(); renderBoundary(); updateRegionUI(); flushNow(); } else siRender(true); siUpdateUI(); }
    (function(){ var pn=document.getElementById("siPanel"), btn=document.getElementById("siBtn"); if(!pn||!btn) return;
      btn.addEventListener("pointerdown",function(e){ e.stopPropagation(); }); btn.addEventListener("click",function(e){ e.stopPropagation(); siAnalyze(false); });
      pn.addEventListener("pointerdown",function(e){ e.stopPropagation(); });
      pn.addEventListener("click",function(e){ e.stopPropagation(); var t=e.target; while(t&&t!==pn&&!(t.getAttribute&&t.getAttribute("data-act"))) t=t.parentNode; if(!t||t===pn) return; var a=t.getAttribute("data-act");
        if(a==="tog"&&siDraft){ var id=t.getAttribute("data-id"); if(siDraft.off[id]) delete siDraft.off[id]; else siDraft.off[id]=true; siRender(true); }
        else if(a==="apply") siApply(); else if(a==="discard"||a==="close") siDiscard(); else if(a==="again") siAnalyze(true); else if(a==="retry") siAnalyze(false); });
    })();
    restore();   // reopen the saved survey (all floors) for this project (if any)
    siProbe();   // Phase 7: ONE capability GET (no AI) so the Analyze action only shows when the server is configured
  </script>
