<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Build Your CCTV System</title>
<style>
/* Layout: one-screen app — ink top bar, horizontal slide track, ink bottom bar with live total. VAULT DARK palette. */
:root{
  --bg:#FAF8F4; --surface:#FFFFFF; --surface-2:#F0EDE8; --fg:#0B0F1A; --muted:#5B6070;
  --slate:#2C3347; --gold:#C9A96E; --gold-ink:#7E6030; --line:#E2DCD0;
  --bar:#0B0F1A; --bar-fg:#FAF8F4; --bar-muted:#9298A8;
  --good:#2F6B4A; --good-bg:#E5F0E9; --warn:#8F5410; --warn-bg:#FBEEDB; --red:#A33A2B;
  --sel:#FBF5EA;
  --f-body:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --f-num:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0F1A; --surface:#131A2A; --surface-2:#1A2236; --fg:#EDE9E1; --muted:#9BA1B0;
  --slate:#2C3347; --gold:#C9A96E; --gold-ink:#D9BC88; --line:#283048;
  --bar:#05070D; --bar-fg:#EDE9E1; --bar-muted:#8A90A0;
  --good:#7CC39A; --good-bg:#14281E; --warn:#E8B06A; --warn-bg:#2B2012; --red:#E8806F;
  --sel:#1F2639; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F1A; --surface:#131A2A; --surface-2:#1A2236; --fg:#EDE9E1; --muted:#9BA1B0;
  --slate:#2C3347; --gold:#C9A96E; --gold-ink:#D9BC88; --line:#283048;
  --bar:#05070D; --bar-fg:#EDE9E1; --bar-muted:#8A90A0;
  --good:#7CC39A; --good-bg:#14281E; --warn:#E8B06A; --warn-bg:#2B2012; --red:#E8806F;
  --sel:#1F2639; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}

/* top bar */
.top{background:var(--bar);color:var(--bar-fg);border-bottom:2px solid var(--gold);padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-size:13px;letter-spacing:.14em}
.brand span{font-size:11px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase}
.step{margin-left:auto;font-size:12px;color:var(--bar-muted);text-align:right;white-space:nowrap}
.step strong{color:var(--bar-fg);font-weight:600}
.rep-badge{font-size:10px;letter-spacing:.12em;background:var(--gold);color:#0B0F1A;padding:2px 7px;border-radius:3px;font-weight:700}
.icon-btn{background:transparent;border:1px solid #3a4258;border-radius:6px;width:38px;height:38px;display:grid;place-items:center;color:var(--bar-fg);flex:none}
.icon-btn:hover{border-color:var(--gold)}

/* slides */
.viewport{overflow:hidden;position:relative;touch-action:pan-y}
.track{display:flex;height:100%;transition:transform .45s cubic-bezier(.2,.75,.2,1)}
.slide{flex:0 0 100%;height:100%;overflow-y:auto;overscroll-behavior:contain}
.wrap{max-width:700px;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink);font-weight:700;display:flex;align-items:center;gap:10px}
.eyebrow::after{content:"";height:1px;background:var(--gold);flex:1;opacity:.6}
h1{font-size:clamp(24px,5vw,32px);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:17px;margin:0}
.lede{color:var(--muted);margin:0;max-width:60ch}
.skip{align-self:flex-start;background:none;border:none;padding:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.skip:hover{color:var(--fg)}

/* option cards */
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:8px;text-align:left;position:relative}
.opt.sel{border-color:var(--gold);background:var(--sel);box-shadow:inset 3px 0 0 var(--gold)}
.opt-head{display:flex;align-items:center;gap:12px}
.opt-head svg{flex:none;color:var(--gold-ink)}
.opt-title{font-weight:700}
.opt-sub{font-size:13px;color:var(--muted)}
.opt-price{margin-left:auto;font-weight:700;white-space:nowrap}
.pick{background:none;border:none;padding:0;text-align:left;width:100%}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.sel .radio{border-color:var(--gold)}
.sel .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
.check{width:18px;height:18px;border-radius:4px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.sel .check{border-color:var(--gold);background:var(--gold)}
.sel .check::after{content:"";width:5px;height:9px;border:solid #0B0F1A;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold-ink);border:1px solid var(--gold);border-radius:3px;padding:1px 6px;white-space:nowrap}

details.why{font-size:13.5px;color:var(--muted)}
details.why summary{cursor:pointer;color:var(--gold-ink);font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:6px}
details.why summary::-webkit-details-marker{display:none}
details.why summary::before{content:"+";font-weight:700;width:14px}
details.why[open] summary::before{content:"–"}
details.why p{margin:6px 0 0;max-width:60ch}
.specs{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:8px 0 0;font-size:13px}
.specs dt{color:var(--muted)} .specs dd{margin:0;color:var(--fg)}

/* stepper + presets */
.counter{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;align-items:center;justify-content:center;gap:18px}
.counter button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:24px;line-height:1}
.counter button:hover{border-color:var(--gold)}
.counter button:disabled{opacity:.35;cursor:default}
.count-val{text-align:center;min-width:110px}
.count-val b{display:block;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.count-val span{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.presets.tiered{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}
.presets.tiered .preset{padding:22px 10px}
.presets.tiered .preset b{font-size:26px}
.custom-count{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px;margin-top:4px}
.cc-head{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);font-weight:700}
.cc-val{font-size:15px;color:var(--muted);text-align:center}
.cc-val input{font:inherit;font-size:30px;font-weight:700;width:3.2em;text-align:center;border:none;border-bottom:2px solid var(--gold);background:transparent;color:var(--fg);padding:0 4px}
.cc-slider{width:100%;accent-color:var(--gold);height:28px}
.cc-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-8px;font-variant-numeric:tabular-nums}
.cc-row{display:flex;align-items:center;gap:14px}
.mini-round{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:22px;line-height:1}
.mini-round:disabled{opacity:.35}
.cc-now{font-size:22px;font-weight:700;min-width:44px;text-align:center}
.quick-label{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
#sl-count .wrap{min-height:100%;justify-content:center}
.intro-hero{min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:16px}
.intro-hero .start{margin-top:8px}
.preset{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 8px;text-align:center}
.preset b{display:block;font-size:18px}
.preset span{font-size:11.5px;color:var(--muted)}
.preset.sel{border-color:var(--gold);background:var(--sel)}
.mini-step{display:inline-flex;align-items:center;gap:8px}
.mini-step button{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);font-size:17px}
.mini-step b{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}

/* info panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.panel-h{background:var(--slate);color:#FAF8F4;padding:9px 14px;font-weight:700;font-size:13px;letter-spacing:.04em;border-left:3px solid var(--gold);display:flex;justify-content:space-between;gap:10px}
.panel-b{padding:12px 14px;display:grid;gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv span:first-child{color:var(--muted)}
.svc{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.svc:first-child{border-top:none;padding-top:0}
.svc b{font-size:14px}
.svc small{grid-column:1/-1;color:var(--muted);font-size:13px}
.svc.off b{opacity:.5;text-decoration:line-through}
.svc.off .num{opacity:.5}
.x{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;line-height:1;display:grid;place-items:center;flex:none}
.x:hover{border-color:var(--gold)}
.svc .tag{font-weight:600;margin-left:6px;vertical-align:middle}
.note{font-size:13px;padding:10px 12px;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
.note.good{background:var(--good-bg);color:var(--good)}
.fine{font-size:12px;color:var(--muted);margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:none;padding:8px 14px;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--slate);color:#FAF8F4}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.row label{font-size:13px;color:var(--muted)}

/* review */
.quote{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.q-group{padding:6px 14px 10px}
.q-group h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);margin:10px 0 4px}
.q-line{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:5px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.q-line:last-child{border-bottom:none}
.q-line small{color:var(--muted);font-size:12px}
.q-line .amt{font-variant-numeric:tabular-nums;text-align:right}
.q-line.disc .amt,.q-line.disc span{color:var(--red)}
.q-tot{background:var(--bar);color:var(--bar-fg);border-top:2px solid var(--gold);padding:14px;display:grid;gap:4px}
.q-tot .kv span:first-child{color:var(--bar-muted)}
.q-tot .grand{font-size:15px}
.q-tot .grand b{color:var(--gold);font-size:24px;font-variant-numeric:tabular-nums}

/* security level cards — side-by-side carousel */
.level-carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.opt.level{padding:0;flex:1 1 0;min-width:200px;scroll-snap-align:start;display:flex;flex-direction:column;overflow:hidden}
.opt.level.is-rec{border-color:var(--good)}
.opt.level .pick{padding:15px 16px;display:grid;gap:9px;align-content:start;width:100%;flex:1}
.rec-banner{background:var(--good);color:#fff;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:6px 10px;white-space:nowrap}
:root[data-theme="dark"] .rec-banner,:root:not([data-theme="light"]) .rec-banner{color:#06130C}
.lvl-head{display:flex;align-items:center;gap:10px}
.lvl-name{font-weight:700;font-size:19px;line-height:1.1}
.lvl-line{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);margin-top:-4px}
.lvl-tag{margin-left:auto;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:2px 7px}
.feat{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:7px}
.feat li{display:flex;align-items:flex-start;gap:9px;font-size:14px;line-height:1.35;color:var(--fg)}
.feat li svg{color:var(--good);flex:none;margin-top:3px}

/* recorder / retention step */
.daychips{display:flex;flex-wrap:wrap;gap:8px}
.daychip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600}
.daychip.on{background:var(--slate);color:#FAF8F4;border-color:var(--slate)}
.counter.compact{padding:12px}
.counter.compact button{width:44px;height:44px;font-size:20px}
.counter.compact .count-val b{font-size:34px}
.sys-line{font-size:13px;color:var(--muted);letter-spacing:.02em}
.rec-hero .panel-h{background:var(--slate)}
.panel-h.good{background:var(--good);color:#fff;border-left-color:#06130C}
:root[data-theme="dark"] .panel-h.good,:root:not([data-theme="light"]) .panel-h.good{color:#06130C}
.opt.stor.is-rec{border-color:var(--good);overflow:hidden}
.opt.stor.is-rec .pick{padding-top:10px}
.rec-days{font-size:28px;font-weight:700;line-height:1.1;display:flex;flex-direction:column;gap:2px}
.rec-days span{font-size:13px;font-weight:400;color:var(--muted);letter-spacing:.02em}
.panel.upgrade .panel-h{background:var(--gold);color:#0B0F1A;border-left-color:#0B0F1A}
.upgrade-opts{display:grid;gap:8px;margin-top:4px}
.upgrade-opts .opt{display:block;width:100%;text-align:left;background:var(--surface-2)}
.upgrade-opts .opt.sel{border-color:var(--gold);background:var(--sel);box-shadow:inset 3px 0 0 var(--gold)}
.stor-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
.opt.stor{padding:0}
.opt.stor .pick{padding:12px 14px;display:grid;gap:4px}
.stor-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.stor-top b{font-size:20px}
.stor-days{font-size:14px;color:var(--gold-ink);font-weight:600}
.opt.stor.is-rec{border-color:var(--gold)}

/* floor-plan upload */
.plan-drop{display:flex;flex-direction:column;align-items:center;gap:3px;padding:18px;border:1.5px dashed var(--gold);border-radius:10px;background:var(--sel);text-align:center;cursor:pointer}
.plan-drop:hover{border-color:var(--gold-ink)}
.plan-cta{font-weight:700;color:var(--gold-ink)}
.plan-prev{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.plan-prev img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.plan-file{width:64px;height:64px;border-radius:8px;background:var(--slate);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.plan-meta{display:flex;flex-direction:column;min-width:0;flex:1}
.plan-meta b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-meta span{font-size:12px;color:var(--muted)}

.sub-q{display:grid;gap:8px;padding:0 12px 12px}
.sub-q .row{justify-content:space-between}
.cflags{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 14px;min-height:36px;font:600 13px var(--f-body);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.chip.on{background:var(--slate);color:#FAF8F4;border-color:var(--slate)}
@media (prefers-reduced-motion:reduce){.chip{transition:none}}

/* security feature checklist (Step 2) */
.feat-h{font-size:clamp(18px,3.6vw,22px);margin:2px 0 0;line-height:1.15}
.feat-list{display:flex;flex-direction:column;gap:8px}
.feat-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);cursor:pointer;min-height:50px;transition:border-color .15s,background .15s}
.feat-row.on{border-color:var(--gold);background:var(--sel)}
.feat-box{flex:none;width:22px;height:22px;border:2px solid var(--line);border-radius:6px;position:relative;transition:border-color .15s,background .15s}
.feat-row.on .feat-box{border-color:var(--gold);background:var(--gold)}
.feat-row.on .feat-box::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #0B0F1A;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.feat-name{font-weight:600;font-size:15px}
.feat-rec{margin-top:6px;padding:10px 12px;border:1px solid var(--good);border-radius:9px;background:rgba(60,160,90,.10);font-size:13.5px}
.feat-rec-k{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--good);margin-right:6px}
.lvl-price{margin-left:auto;font-weight:700;font-size:16px}
@media (prefers-reduced-motion:reduce){.feat-row,.feat-box{transition:none}}

.promo-box{display:grid;gap:6px}
.promo-box>label{font-size:13px;font-weight:600}
.promo-row{display:flex;gap:8px}
.promo-row input{flex:1;min-width:0;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);text-transform:uppercase;letter-spacing:.04em}
.promo-row .btn{flex:none}

/* rep box */
.rep{border:1px dashed var(--gold);border-radius:8px;padding:12px 14px;display:grid;gap:10px;background:var(--surface-2)}
.rep-h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold-ink)}
.rep input,.rep select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);max-width:100%}
.flags{margin:0;padding-left:18px;font-size:12.5px;color:var(--warn)}

/* form */
.form{display:grid;gap:12px}
.field{display:grid;gap:4px}
.field label{font-size:13px;font-weight:600}
.field input,.field textarea,.field select{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:100%}
/* address autocomplete — Photon fallback dropdown (Google renders its own .pac-container) */
.addr-sug{display:none;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;box-shadow:0 10px 28px rgba(16,17,18,.14)}
.addr-sug.open{display:block}
.addr-opt{display:flex;flex-direction:column;gap:1px;padding:9px 12px;cursor:pointer;border-top:1px solid var(--line)}
.addr-opt:first-child{border-top:0}
.addr-opt:hover{background:var(--sel)}
.addr-opt b{font-weight:600;font-size:14px}
.addr-opt span{font-size:12px;color:var(--muted)}
.pac-container{z-index:5000}
/* email "did you mean" suggestion + address/unit row */
.email-sug{align-self:flex-start;margin-top:2px;background:var(--warn-bg);color:var(--warn);border:1px solid transparent;border-radius:7px;padding:6px 10px;font:600 12.5px var(--f-body);cursor:pointer}
.email-sug:hover{border-color:var(--warn)}
.grid-addr{display:grid;grid-template-columns:1fr 130px;gap:12px}
@media (max-width:520px){.grid-addr{grid-template-columns:1fr}}
.field .err{font-size:12px;color:var(--red)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.btn{border:none;border-radius:8px;padding:12px 18px;font-weight:700;background:var(--gold);color:#0B0F1A}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.done-card{background:var(--surface);border:1px solid var(--gold);border-radius:8px;padding:16px;display:grid;gap:10px}
.done-card pre{white-space:pre-wrap;font-size:12.5px;background:var(--surface-2);padding:12px;border-radius:6px;margin:0;max-height:260px;overflow:auto;font-family:ui-monospace,Menlo,monospace}

/* intro */
.hero-steps{display:grid;gap:8px;counter-reset:s}
.hero-steps li{list-style:none;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.hero-steps li::before{counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--slate);color:var(--gold);font-weight:700;font-size:12px;display:grid;place-items:center}
.hero-steps{padding:0;margin:0}
.start{align-self:flex-start;font-size:16px;padding:14px 24px}

/* bottom bar */
.bottom{background:var(--bar);color:var(--bar-fg);border-top:2px solid var(--gold);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.nav{height:44px;padding:0 16px;border-radius:8px;border:1px solid #3a4258;background:transparent;color:var(--bar-fg);font-weight:600}
.nav.next{background:var(--gold);border-color:var(--gold);color:#0B0F1A}
.nav:disabled{opacity:.3;cursor:default}
.mid{display:grid;justify-items:center;gap:6px;min-width:0;width:100%}
/* three-segment progress bar (Your Details · Build System · Review Quote) */
.dots{display:flex;gap:6px;width:100%;max-width:420px}
.seg{flex:1;min-width:0;border:none;background:#2a3245;color:var(--bar-muted);height:26px;border-radius:7px;padding:0 6px;font:700 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .18s,color .18s}
.seg>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg.done{background:#5a4e35;color:#e7d9bd}
.seg.on{background:var(--gold);color:#0B0F1A}
.total{font-size:12px;color:var(--bar-muted);white-space:nowrap}
.total b{color:var(--bar-fg);font-size:16px;font-variant-numeric:tabular-nums;margin-left:4px}
.total i{font-style:normal;color:var(--gold)}
.total .prelim{font-style:normal;color:var(--warn);font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.rev-edit{background:none;border:none;color:var(--gold);font:700 12px var(--f-body);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}

/* ===== 3-step layout: step header + Step-2 accordions ===== */
.step-h{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.step-h h1{font-size:clamp(22px,4.5vw,28px)}
.wrap.step-build{gap:12px}
.acc{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.acc.open{border-color:var(--gold)}
.acc-h{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 14px;background:none;border:none;text-align:left;color:var(--fg)}
.acc-ic{flex:none;width:34px;height:34px;display:grid;place-items:center;color:var(--gold-ink)}
.acc-ic svg{width:26px;height:26px}
.acc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.acc-t b{font-size:15.5px;font-weight:700}
.acc-t small{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-chev{flex:none;width:20px;height:20px;color:var(--muted);transition:transform .2s}
.acc.open .acc-chev{transform:rotate(180deg);color:var(--gold-ink)}
.acc-b{padding:4px 14px 16px;display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line)}
.acc-b>*{margin:0}
@media (prefers-reduced-motion:reduce){.acc-chev{transition:none}}

/* ===== Step 3 (System) — flat sections, options strip ===== */
.wrap.step-system{gap:0}
.sys-block{display:flex;flex-direction:column;gap:14px;padding:4px 0}
.sys-block>.eyebrow{margin-bottom:2px}
.sys-div{border:none;border-top:1px solid var(--line);margin:18px 0 0}
.muted-note{color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.opts-strip{display:flex;flex-direction:column;gap:12px}
.orow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.orow .olabel{font-weight:600;font-size:14px}
.oseg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.oseg button{border:none;background:none;padding:8px 14px;min-height:38px;font:600 13px var(--f-body);color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.oseg button+button{border-left:1px solid var(--line)}
.oseg button.on{background:var(--slate);color:#FAF8F4}
@media (prefers-reduced-motion:reduce){.oseg button{transition:none}}

/* index drawer */
.scrim{position:fixed;inset:0;background:rgba(5,7,13,.55);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);background:var(--bg);z-index:21;display:flex;flex-direction:column;border-left:2px solid var(--gold);padding-top:env(safe-area-inset-top,0px)}
.drawer-h{background:var(--bar);color:var(--bar-fg);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.drawer-b{overflow-y:auto;padding:12px 16px 24px;display:grid;gap:6px;align-content:start}
.ix{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left}
.ix.on{border-color:var(--gold);background:var(--sel)}
.ix .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.ix.done .n{background:var(--gold);color:#0B0F1A}
.ix small{display:block;color:var(--muted);font-size:12px}
.pin{display:flex;gap:8px;margin-top:10px}
.pin input{flex:1;min-width:0;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}

@media (max-width:520px){
  .bottom{grid-template-columns:auto 1fr auto;gap:8px;padding-inline:12px}
  .nav{padding:0 12px}
  .nav .lbl{display:none}
  .count-val b{font-size:40px}
}
@media (prefers-reduced-motion:reduce){.track{transition:none}}

/* =====================================================================
   PRICING ENGINE — pure functions, no DOM.
   ===================================================================== */
const Engine = (() => {
  const C = CONFIG.catalog;
  const R = C.retention;
  const nvrTiers = Object.keys(C.nvr).map(Number).sort((a,b)=>a-b); // [8,16,32]
  const driveSizes = Object.keys(C.drives).map(Number).sort((a,b)=>a-b);

  function nvrTier(n){ return n<=8 ? 8 : n<=16 ? 16 : 32; }
  function boxesFor(n){ return n<=4 ? 0.5 : Math.ceil(n/8); }
  function planTier(n){ return Math.ceil(n/8); }
  function planMonthly(kind, n){ return kind==='none' ? 0 : C.plans[kind]*planTier(n); }
  function maxStorageOf(nvr){ return nvr.bays * nvr.maxTB; }

  // ---- canonical storage-sizing engine -----------------------------------
  function profile(res){ return R.profiles[res] || R.profiles['8MP']; }
  // camera groups → [{count,res,tbPerDay}]; mixed resolution handled natively
  function cameraGroups(s){
    const n = s.cams, n12 = Math.min(s.n12||0, n), n8 = n - n12, g = [];
    if(n8)  g.push({ count:n8,  res:'8MP',  tbPerDay:profile('8MP').tbPerDay });
    if(n12) g.push({ count:n12, res:'12MP', tbPerDay:profile('12MP').tbPerDay });
    return g;
  }
  function dailyTB(groups){ return groups.reduce((a,g)=>a + g.count*g.tbPerDay, 0); }
  function roundUpTB(tb){ const inc=R.incrementTB; return Math.max(R.minTB, Math.ceil((tb - 1e-9)/inc)*inc); }
  function clampDays(d){ const [lo,hi]=R.dayRange; d=Math.round(+d||R.defaultDays); return Math.min(hi, Math.max(lo, d)); }
  function retentionDays(storageTB, daily){ return daily>0 ? storageTB/daily : 0; }       // precise
  function estDays(storageTB, daily){ return Math.floor(retentionDays(storageTB, daily)); } // conservative (floor)

  // cheapest set of real drives (≤bays, each ≤maxPerBay) summing to exactly targetTB
  function realizeDrives(targetTB, nvr){
    const bays = nvr.bays, cap = Math.min(nvr.maxTB, R.maxPerBayTB);
    const usable = driveSizes.filter(d=>d<=cap);
    const memo = new Map();
    function best(rem, baysLeft){
      if(rem===0) return { price:0, drives:[] };
      if(baysLeft===0) return null;
      const key = rem+'/'+baysLeft; if(memo.has(key)) return memo.get(key);
      let win = null;
      for(const d of usable){ if(d>rem) break;
        const sub = best(rem-d, baysLeft-1);
        if(sub){ const cand = { price:sub.price+C.drives[d], drives:[d,...sub.drives] };
          if(!win || cand.price<win.price) win = cand; }
      }
      memo.set(key, win); return win;
    }
    const r = best(targetTB, bays);
    return r ? { price:r.price, drives:r.drives.sort((a,b)=>b-a) } : null;
  }
  // smallest NVR tier satisfying BOTH channel count and storage target
  function smallestNvr(cams, targetTB){
    for(const t of nvrTiers){ const nv=C.nvr[t]; if(nv.ch>=cams && maxStorageOf(nv)>=targetTB) return nv; }
    return null;
  }

  // THE one function every surface derives from
  function sizeStorage(s){
    const groups = cameraGroups(s);
    const daily = dailyTB(groups);                         // TB/day for the whole system
    const days = clampDays(s.desiredDays);
    const rawTB = daily * days;                            // raw requirement
    const recommendedTB = daily>0 ? roundUpTB(rawTB) : R.minTB;

    const channelTier = nvrTier(s.cams);                   // recorder the camera COUNT needs
    const currentNvr = C.nvr[channelTier];
    const currentMax = maxStorageOf(currentNvr);

    const recNvr = smallestNvr(s.cams, recommendedTB);     // satisfies channels AND storage
    const noStandardFit = !recNvr;                         // beyond entire catalog → custom quote
    const requiresUpgrade = !noStandardFit && recNvr.ch > currentNvr.ch
                            || (!noStandardFit && recNvr.code !== currentNvr.code && recommendedTB > currentMax);

    // which recorder is actually active, honoring the customer's upgrade choice
    let activeNvr;
    if(noStandardFit) activeNvr = C.nvr[nvrTiers[nvrTiers.length-1]];
    else if(requiresUpgrade && s.nvrUpgrade==='keep') activeNvr = currentNvr;
    else activeNvr = recNvr;
    // channel count alone may still force a bigger recorder than "keep" implies
    if(activeNvr.ch < s.cams) activeNvr = smallestNvr(s.cams, 0) || activeNvr;
    const activeMax = maxStorageOf(activeNvr);

    // storage target: manual pick if any, else recommended, clamped to what the active recorder holds
    const base = (s.selectedStorageTB!=null) ? roundUpTB(s.selectedStorageTB) : recommendedTB;
    const storageTB = Math.min(activeMax, Math.max(R.minTB, base));
    const realized = realizeDrives(storageTB, activeNvr) || realizeDrives(activeMax, activeNvr);

    const estimatedDays = estDays(storageTB, daily);
    const maxDaysCurrentNvr = estDays(currentMax, daily);
    const meetsTarget = estimatedDays >= days;

    // capacity options to show: 2TB steps around the recommendation, within the active recorder
    const opts = [];
    for(let tb=R.minTB; tb<=activeMax; tb+=R.incrementTB){
      const d = realizeDrives(tb, activeNvr); if(!d) continue;
      opts.push({ tb, price:d.price, drives:d.drives, days:estDays(tb, daily),
                  recommended: tb===recommendedTB && !noStandardFit && tb<=activeMax });
    }
    // trim to a tidy window around the recommended / selected capacity (keep ≤6 for mobile)
    const focus = Math.max(storageTB, recommendedTB);
    let view = opts;
    if(opts.length>6){
      const idx = opts.findIndex(o=>o.tb>=focus);
      const start = Math.max(0, Math.min(idx-1, opts.length-6));
      view = opts.slice(start, start+6);
      if(!view.some(o=>o.recommended)){ const rc=opts.find(o=>o.recommended); if(rc) view=[rc,...view].slice(0,6).sort((a,b)=>a.tb-b.tb); }
    }

    return {
      groups, daily, days, rawTB, recommendedTB,
      currentNvr, currentMax, recNvr, activeNvr, activeMax,
      storageTB, drives:realized ? realized.drives : [], drivePrice:realized ? realized.price : 0,
      estimatedDays, maxDaysCurrentNvr, meetsTarget,
      requiresUpgrade, noStandardFit, options:opts, viewOptions:view,
      manual: s.selectedStorageTB!=null, calcVersion:C.calcVersion
    };
  }

  function compute(s){
    const n = s.cams, n12 = Math.min(s.n12, n), n8 = n - n12;
    const flags = [], warnings = [];

    // canonical storage sizing drives the recorder, the drives and the retention
    const ss = sizeStorage(s);
    const nvr = ss.activeNvr, tier = nvr.ch, autoTier = ss.currentNvr.ch;
    if(!nvr.verified) flags.push(`${nvr.code}: bays (${nvr.bays}), PoE ports and 12MP support are assumptions — confirm the stocked SKU.`);
    if(n12) flags.push('12MP camera SKU + datasheet not verified (spec BLOCKER).');
    if(ss.noStandardFit) warnings.push(`${ss.recommendedTB}TB for ${ss.days} days exceeds every standard recorder. IOT TECHS will size a custom storage system.`);
    if(ss.requiresUpgrade && s.nvrUpgrade==='keep') warnings.push(`Current ${ss.currentNvr.name} holds up to ${ss.currentMax}TB — about ${ss.maxDaysCurrentNvr} days with this setup, below your ${ss.days}-day target.`);

    const level = C.levels.find(l=>l.id===s.level) || C.levels[0];
    if(level.suggest12MP && n12<n) flags.push('Pro tier: license plate recognition works best on 12MP cameras.');

    // cameras
    const lines = [];
    if(n8)  lines.push({ g:'Equipment', code:'CAM-8',  label:'8MP camera',  qty:n8,  unit:C.cam[8].price,  amt:n8*C.cam[8].price });
    if(n12) lines.push({ g:'Equipment', code:'CAM-12', label:'12MP camera', qty:n12, unit:C.cam[12].price, amt:n12*C.cam[12].price });
    const watts = n8*C.cam[8].watts;
    if(n8) flags.push(`PoE load ≈ ${watts.toFixed(1)} W for ${n8} × 8MP at 6.5 W max (802.3af)${n12?' + 12MP draw unknown':''}. Check recorder/switch PoE budget.`);
    lines.push({ g:'Equipment', code:nvr.code, label:nvr.name, qty:1, unit:nvr.price, amt:nvr.price });

    // storage drives (realized from the 2TB capacity target)
    const counts = {}; ss.drives.forEach(d=>counts[d]=(counts[d]||0)+1);
    Object.keys(counts).map(Number).sort((a,b)=>b-a).forEach(tb=>{
      lines.push({ g:'Equipment', code:`HDD-${tb}`, label:`${tb}TB surveillance drive`, qty:counts[tb], unit:C.drives[tb], amt:counts[tb]*C.drives[tb] });
    });

    // PoE switch
    let poeKind = null;
    if(s.poe==='auto'){ if(n>=17) poeKind = 'bundle'; }
    else if(s.poe!=='none') poeKind = s.poe;
    if(n>=17 && s.poe==='none') warnings.push('17+ cameras need more PoE ports than the recorder provides.');
    if(n>=17 && !(nvr.poe>=16)) flags.push('Auto switch price assumes 16 built-in PoE ports on the 32CH recorder.');
    if(poeKind){
      const p = C.poe[poeKind];
      lines.push({ g:'Equipment', code:p.code, label:'16-port PoE switch'+(poeKind==='bundle'?' (bundle price)':''), qty:1, unit:p.price, amt:p.price });
      flags.push('Check PoE switch wattage against total camera draw.');
    }

    // security-level AI programming adder. Essential = $0; Smart/Pro = $25/camera advanced AI programming
    // (same camera hardware, NVR and storage as Essential — only the configuration differs). Pro layers
    // specialized facial/LPR on top, priced separately at the survey (see the `specialized` flag).
    const levelPerCam = level.addPerCamera||0, levelFlat = level.addFlat||0;
    const levelAmt = Math.round(levelFlat + levelPerCam*n);
    if(levelAmt>0){
      const aiLabel = level.aiLabel || `${level.name} AI package`;
      if(levelPerCam>0 && levelFlat===0) lines.push({ g:'Installation', code:'AI-'+level.id.toUpperCase(), label:aiLabel, qty:n, unit:levelPerCam, amt:levelAmt });
      else lines.push({ g:'Installation', code:'AI-'+level.id.toUpperCase(), label:aiLabel, qty:1, unit:levelAmt, amt:levelAmt });
    }

    // installation services (camera programming is optional)
    C.services.forEach(sv=>{
      if(sv.code==='PROG' && s.skipProg) return;
      lines.push({ g:'Installation', code:sv.code, label:sv.name, qty:n, unit:sv.price, amt:n*sv.price });
    });

    // cable
    const baseBoxes = boxesFor(n), boxes = baseBoxes + (s.extraBoxes||0);
    const cab = C.cable[s.env];
    const footage = s.footage ?? n*C.cable.feetPerCam;
    const allocated = boxes*C.cable.feetPerBox;
    if(footage > allocated) warnings.push(`Estimated ${footage.toLocaleString()} ft exceeds the ${allocated.toLocaleString()} ft allocated. Add a cable box.`);
    lines.push({ g:'Cable', code:cab.code, label:`${cab.name} · ${boxes===0.5?'half box':boxes+(boxes===1?' box':' boxes')} (1,000 ft each)`, qty:boxes, unit:cab.price, amt:Math.round(boxes*cab.price) });

    const base = lines.reduce((a,l)=>a+l.amt,0);
    const discount = Math.round(base*(s.discount||0));
    const discountedBase = base - discount;

    // customer promo / voucher — discounts the package only, capped so it can't exceed it
    let promo = null, promoDiscount = 0;
    if(s.promoCode){
      const p = C.promos[s.promoCode];
      if(p){ promo = { code:s.promoCode, ...p };
        promoDiscount = p.type==='percent' ? Math.round(discountedBase*p.value) : Math.min(p.value, discountedBase);
      }
    }
    const netBase = discountedBase - promoDiscount;

    // add-ons (never discounted)
    const addons = [];
    ['monitor','mount','ups'].forEach(k=>{ if(s[k]){ const a=C.addons[k]; addons.push({ g:'Add-ons', code:a.code, label:a.name, qty:1, unit:a.price, amt:a.price }); }});
    const addonTotal = addons.reduce((a,l)=>a+l.amt,0);

    // service plan
    const monthly = planMonthly(s.plan, n);
    const months = s.term*12;
    const termTotal = monthly*months;
    const prepaid = Math.round(termTotal*5/6/100)*100;
    const planUpfront = s.plan!=='none' && s.billing==='prepaid' ? prepaid : 0;
    const planMonthlyDue = s.plan!=='none' && s.billing==='monthly' ? monthly : 0;

    const adjust = Math.round(s.adjust||0);
    const beforeTax = netBase + addonTotal + planUpfront + adjust;
    const tax = Math.round(beforeTax*(s.taxRate||0));
    const total = beforeTax + tax;

    return { n, n8, n12, level, nvr, tier, autoTier, ss, boxes, baseBoxes, footage, allocated,
             lines, base, discount, discountedBase, promo, promoDiscount, netBase, addons, addonTotal,
             plan:{ kind:s.plan, monthly, months, termTotal, prepaid, upfront:planUpfront, monthlyDue:planMonthlyDue, tier:planTier(n) },
             adjust, beforeTax, tax, total, warnings, flags };
  }
  return { compute, sizeStorage, nvrTier, boxesFor, planMonthly };
})();

// Name: title-case all-lower/all-upper words but PRESERVE already-mixed-case input (McDonald, DeMarco,
// O'Neill), honouring hyphens/apostrophes and the Mc- prefix. Applied on blur, never mid-typing.
function titleWord(w){
  if(!w) return w;
  if(/[a-zà-öø-ÿ]/.test(w) && /[A-ZÀ-ÖØ-Þ]/.test(w.slice(1))) return w;   // user already mixed-cased it → keep
  let out = w.toLowerCase().replace(/(^|[-'’ ])([a-zà-öø-ÿ])/g, (m,sep,ch)=>sep+ch.toUpperCase());
  out = out.replace(/\bMc([a-zà-öø-ÿ])/g, (m,ch)=>'Mc'+ch.toUpperCase());   // McDonald
  return out;
}
function smartName(v){ return String(v||'').replace(/\s+/g,' ').trim().split(' ').map(titleWord).join(' '); }
// Phone: US NANP. Strip a leading 1/+1, keep 10 digits, format (xxx) xxx-xxxx; E.164 when complete.
function phoneDigits(v){ let d=String(v||'').replace(/\D/g,''); if(d.length===11 && d[0]==='1') d=d.slice(1); return d.slice(0,10); }
function fmtPhone(v){ const d=phoneDigits(v); if(!d) return ''; if(d.length<4) return '('+d; if(d.length<7) return '('+d.slice(0,3)+') '+d.slice(3); return '('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6,10); }
function phoneE164(v){ const d=phoneDigits(v); return d.length===10 ? '+1'+d : ''; }
// Email: suggest a correction for an obvious domain/TLD typo (never auto-applied).
const EMAIL_DOMAINS = ['gmail.com','googlemail.com','yahoo.com','hotmail.com','outlook.com','live.com','aol.com','icloud.com','me.com','comcast.net','verizon.net','att.net','sbcglobal.net','protonmail.com'];
function levenshtein(a,b){ const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]); for(let j=0;j<=n;j++)d[0][j]=j; for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
function emailSuggest(email){
  const m=/^([^@]+)@([^@]+)$/.exec(String(email||'').trim()); if(!m) return '';
  let dom=m[2].toLowerCase().replace(/\.con$|\.cpm$|\.cmo$|\.vom$/,'.com').replace(/\.comm$/,'.com').replace(/\.co$/,'.com');
  if(EMAIL_DOMAINS.indexOf(dom)>=0) return (dom===m[2].toLowerCase())?'':m[1]+'@'+dom;
  let best=null,bd=99; EMAIL_DOMAINS.forEach(d=>{ const x=levenshtein(dom,d); if(x<bd){bd=x;best=d;} });
  if(best && bd>0 && bd<=2) dom=best;
  return (dom!==m[2].toLowerCase()) ? m[1]+'@'+dom : '';
}

// Recommendation is by the HIGHEST feature level selected, never by count. Monitoring is a separate

function recommendLevel(features){
  const sel = new Set(features||[]);
  const SF = CONFIG.catalog.securityFeatures;
  const cam = SF.filter(f=>!f.service && sel.has(f.id));
  const maxLvl = cam.reduce((m,f)=>Math.max(m, f.level||0), 0);
  const level = maxLvl>=3 ? 'pro' : maxLvl===2 ? 'smart' : 'essential';
  return {
    level,
    hasCamFeatures: cam.length>0,
    wantsMonitoring: sel.has('livemon'),
    specialized: SF.filter(f=>f.specialized && sel.has(f.id)).map(f=>f.id),
    caveats: SF.filter(f=>f.caveat && sel.has(f.id)).map(f=>f.caveat),

}

/* ---------- autosave (resume an interrupted session) ----------
   A per-device draft so a reload or accidental navigation never loses progress. The large floor-plan
   image is excluded (quota) and the draft is cleared on submit. localStorage is wrapped in try/catch and
   the app works if it's blocked. */
const DRAFT_KEY = 'iot-cctv-draft';
let draftT = null;
function saveDraft(){ clearTimeout(draftT); draftT = setTimeout(function(){ try{
  if(submitted){ localStorage.removeItem(DRAFT_KEY); return; }
  const s = JSON.parse(JSON.stringify(state)); if(s.contact) delete s.contact.floorPlanImg;
  localStorage.setItem(DRAFT_KEY, JSON.stringify({ v:1, cur, openAcc, at:Date.now(), state:s }));
}catch(_){} }, 500); }
function loadDraft(){ try{
  const raw = localStorage.getItem(DRAFT_KEY); if(!raw) return false;
  const d = JSON.parse(raw); if(!d || d.v!==1 || !d.state) return false;
  if(d.at && Date.now()-d.at > 1000*60*60*24*14){ localStorage.removeItem(DRAFT_KEY); return false; }   // expire after 2 weeks
  Object.assign(state, d.state); if(state.contact) state.contact.floorPlanImg = null;
  if(typeof d.cur==='number') cur = Math.max(0, Math.min(STEPS.length-1, d.cur));
  if(d.openAcc) openAcc = d.openAcc;
  return true;
}catch(_){ return false; } }

/* ---------- render ---------- */
function render(){
  const q = Engine.compute(state);
  const keep = [...document.querySelectorAll('.slide')].map(el=>el.scrollTop);
  $('#track').innerHTML = STEPS.map((st,i)=>`<section class="slide" id="st-${st.id}" aria-hidden="${i!==cur}" ${i!==cur?'inert':''}>
    <div class="wrap step-${st.id}">
      <div class="step-h"><div class="eyebrow">Step ${i+1} of ${STEPS.length}</div><h1>${st.title}</h1></div>
      ${renderStep(st,q,i)}
    </div></section>`).join('');
  document.querySelectorAll('.slide').forEach((el,i)=>{ if(keep[i]) el.scrollTop = keep[i]; });
  chrome(q);
  attachAddr();   // (re)bind Google Places to the rebuilt address field
  saveDraft();    // persist progress
}
function chrome(q){
  q = q || Engine.compute(state);
  $('#track').style.transform = `translateX(${-cur*100}%)`;
  document.querySelectorAll('.slide').forEach((el,i)=>{ el.setAttribute('aria-hidden', i!==cur); el.inert = i!==cur; });
  $('#stepLbl').innerHTML = `<strong>${cur+1}</strong> / ${STEPS.length} · ${STEPS[cur].label}`;
  // three-segment progress bar (Intake → Your Project → System); segments jump when reachable
  $('#dots').innerHTML = STEPS.map((st,i)=>`<button class="seg ${i===cur?'on':''} ${(i<cur||done.has(i))?'done':''}" data-go="${i}" aria-label="${st.label}" aria-current="${i===cur}"><span>${st.label}</span></button>`).join('');
  const prelim = state.extStorage || q.ss.noStandardFit || recommendLevel(state.features).specialized.length>0;   // extended storage or specialized facial/LPR → total not final
  // Running total only on the System step — the earlier steps have no cost inputs yet.
  $('#total').innerHTML = cur < STEPS.length-1 ? '' : `${prelim?'<em class="prelim">Preliminary ·</em> ':''}Est. total <b>${money(q.total)}</b>${q.plan.monthlyDue?` <i>+ ${money(q.plan.monthlyDue)}/mo</i>`:''}`;
  $('#prev').disabled = cur===0;
  const nx=$('#next'), lbl=nx.querySelector('.lbl');
  lbl.textContent = cur < STEPS.length-1 ? 'Continue' : 'Submit';
  nx.disabled = (cur===STEPS.length-1 && !!submitted);
  $('#repBadge').hidden = !rep;
  if(drawer) renderDrawer(q);
}
function go(i){
  i = Math.max(0, Math.min(STEPS.length-1, i));
  if(i>cur) for(let k=cur;k<i;k++) done.add(k);
  cur = i; chrome();
  const sl = document.querySelectorAll('.slide')[cur]; if(sl) sl.scrollTop = 0;
  attachAddr();   // reaching the address step (via nav) triggers the lazy Maps load + binding
}
// Forward navigation that gates Step 1 on valid contact and submits on the last step.
function goNext(){
  if(cur===0){ if(!validateContact(true)){ render(); return; } go(1); return; }
  if(cur===STEPS.length-1){ if(submitted) return; if(validateContact(true)) finalizeQuote(); else go(0); return; }
  go(cur+1);
}

/* ---------- actions ---------- */
// camera/resolution/day changes invalidate any manual storage pick or kept-recorder choice
function resetStorage(){ state.selectedStorageTB = null; state.nvrUpgrade = 'auto'; }
// count is the source of truth; set it, auto-raise the recorder tier if it was exceeded, keep a friendly note
function setCams(n){
  const [lo,hi] = CONFIG.camRange;
  n = Math.min(hi, Math.max(lo, Math.round(n||lo)));
  state.cams = n; state.n12 = Math.min(state.n12, n);
  const t = Engine.nvrTier(n);
  if(t > state.sizeTier){ const room = t - n;
    bumpMsg = `Recorder updated to ${t}-channel — supports your ${n}-camera system${room>0?`, with room for ${room} more`:''}.`;
    state.sizeTier = t;
  } else bumpMsg = '';
  resetStorage();
}

function validateContact(showErr){

  setErr('phone', phoneDigits(c.phone).length===10?'':'Enter a 10-digit U.S. phone number.');
  setErr('email', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((c.email||'').trim())?'':'Enter a valid email.');
  setErr('address', c.address.trim()?'':'Enter the property address.');
  if(!ok && showErr && firstBad){ const el=$('#c_'+firstBad); if(el){ try{ el.focus(); }catch(_){} } }

function finalizeQuote(){
  if(submitted || window.__cctvSubmitting) return;   // prevent double-tap / double-submit

    site:{ existingSystem:c.existingSystem, existingType:c.existingType, existingWorking:c.existingWorking,
      construction:c.construction,
      constructionDetails: c.construction ? { noSheetrock:!!c.noSheetrock, dropCeiling:!!c.dropCeiling, needPermits:!!c.needPermits } : null,
      hasDeadline:c.hasDeadline, deadline:c.deadline,

    security:(()=>{ const r=recommendLevel(state.features), SF=CONFIG.catalog.securityFeatures, lbl=id=>(SF.find(f=>f.id===id)||{}).label||id;
      return { features:[...(state.features||[])], featureLabels:(state.features||[]).map(lbl),
        recommendedPackage:r.level, selectedPackage:state.level, packageManual:!!state.levelManual,
        liveMonitoring:r.wantsMonitoring, specializedRequirements:r.specialized, specializedLabels:r.specialized.map(lbl),
        customQuote: r.specialized.length>0 || !!state.extStorage || q.ss.noStandardFit }; })(),
    storage:{ desiredRetentionDays:q.ss.days, recommendedStorageTB:q.ss.recommendedTB, selectedStorageTB:q.ss.storageTB,
      estimatedRetentionDays:q.ss.estimatedDays, dailySystemTB:+q.ss.daily.toFixed(4), rawRequiredTB:+q.ss.rawTB.toFixed(3),
      drives:q.ss.drives, selectedNvr:q.ss.activeNvr.code, nvrUpgrade:state.nvrUpgrade, requiredUpgrade:q.ss.requiresUpgrade, customSizing:q.ss.noStandardFit,

    arr.unshift(lite); localStorage.setItem(k, JSON.stringify(arr.slice(0,25))); }catch(_){}

/* ---------- lead delivery ----------
   ONE hook for handing a finished quote to the pipeline. Stubbed: logs + notifies the host page
   (homepage overlay / analytics) + is ready to POST the snapshot and the floor-plan file (multipart)
   to the FSM backend. Public page never shows cost/margin; this payload is for the backend/rep only. */
function dataUrlToFile(dataUrl, name, type){
  try{ const b = atob(String(dataUrl).split(',')[1]||''); const u = new Uint8Array(b.length);
    for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
    return new File([u], name||'floorplan', { type:type||'application/octet-stream' });
  }catch(_){ return null; }
}
function submitLead(snapshot, fp){
  const file = (fp && fp.dataUrl && !fp.tooBig && !fp.error) ? dataUrlToFile(fp.dataUrl, fp.name, fp.type) : null;
  // The floor plan rides as a multipart FILE; strip its (possibly multi-MB) data URL from the JSON snapshot.
  var lean = snapshot; try{ lean = JSON.parse(JSON.stringify(snapshot)); if(lean.inputs && lean.inputs.contact) delete lean.inputs.contact.floorPlanImg; }catch(_){ }
  try{ console.log('[CCTV] submitLead', snapshot.id, { total:snapshot.total, hasFile:!!file }); }catch(_){}
  // Create the real lead: POST { snapshot JSON, quote text, floor-plan file } to the CRM intake route.
  try{
    var fd = new FormData();
    fd.append('snapshot', JSON.stringify(lean));
    fd.append('text', (submitted && submitted.text) || '');
    if(file) fd.append('floorplan', file, file.name || 'floorplan');
    fetch('/api/leads/cctv', { method:'POST', body:fd, credentials:'same-origin' })
      .then(function(r){ return r.json().catch(function(){ return null; }); })
      .then(function(j){ try{ console.log('[CCTV] lead saved', j); }catch(_){ } })
      .catch(function(err){ try{ console.warn('[CCTV] lead POST failed', err); }catch(_){ } });
  }catch(_){ }
  // Notify the host page (homepage overlay) — analytics / UX only; it does NOT re-POST the lead.
  try{ if(window.parent && window.parent!==window)
        window.parent.postMessage({ type:'iotcctv:lead', id:snapshot.id, total:snapshot.total, hasFile:!!file }, '*'); }catch(_){}
  // Light analytics — only if a provider is already present.
  try{ const p = { cameras:snapshot.inputs.cams, security_level:snapshot.level, total:snapshot.total/100,
        has_deadline:!!snapshot.site.hasDeadline, has_floorplan:!!snapshot.site.floorPlanFile };
    if(window.gtag) window.gtag('event','quote_submitted', p);
    else if(window.dataLayer && window.dataLayer.push) window.dataLayer.push({ event:'quote_submitted', ...p });
  }catch(_){}
}
function copy(text){
  const msg = $('#copyMsg');
  const fallback = ()=>{ const pre=$('#qtext'); if(pre){ const r=document.createRange(); r.selectNodeContents(pre); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} if(msg) msg.textContent='Selected. Press copy on your device.'; };
  try{ navigator.clipboard.writeText(text).then(()=>{ if(msg) msg.textContent='Copied. Paste it into a text or email to your IOT TECHS rep.'; }, fallback); }catch(_){ fallback(); }
}

document.addEventListener('click', e=>{
  const acc = e.target.closest('[data-acc]');
  if(acc){ const id=acc.dataset.acc; openAcc = (openAcc===id ? null : id); render(); return; }   // Step 2 accordion toggle (one open at a time)
  const g = e.target.closest('[data-go]');
  if(g){ go(+g.dataset.go); if(drawer) closeDrawer(); return; }
  const a = e.target.closest('[data-act]'); if(!a) return;
  const v = a.dataset.v, act = a.dataset.act;
  switch(act){
    case 'next': go(cur+1); return;
    case 'skip': skipSlide(); return;
    case 'close': closeDrawer(); return;
    case 'size': { const p=CONFIG.sizeTiers.find(t=>t.ch===+v); state.sizeTier=+v; state.customOpen=false; bumpMsg='';
        state.cams = Math.min(+v, p?p.presets[0]:state.cams); state.n12 = Math.min(state.n12, state.cams); resetStorage(); } break;
    case 'setcams': state.customOpen = false; setCams(+v); break;
    case 'customopen': state.customOpen = true; bumpMsg=''; break;
    case 'customdone': state.customOpen = false; bumpMsg=''; break;
    case 'camadj': setCams(state.cams + +v); break;
    case 'existing': state.contact.existingSystem = !state.contact.existingSystem; if(!state.contact.existingSystem){ state.contact.existingType = null; state.contact.existingWorking = null; } break;
    case 'extype': state.contact.existingType = v; break;
    case 'exwork': state.contact.existingWorking = v; break;
    case 'constr': state.contact.construction = !state.contact.construction; if(!state.contact.construction){ state.contact.noSheetrock = state.contact.dropCeiling = state.contact.needPermits = false; } break;
    case 'cflag': state.contact[v] = !state.contact[v]; break;
    case 'deadline': state.contact.hasDeadline = !state.contact.hasDeadline; if(!state.contact.hasDeadline) state.contact.deadline = ''; break;
    case 'plans': state.contact.floorPlans = !state.contact.floorPlans; if(!state.contact.floorPlans) state.contact.floorPlanImg = null; break;
    case 'planclear': state.contact.floorPlanImg = null; break;
    case 'level': state.level = v; state.levelManual = true; break;   // manual pick wins until "use recommended"
    case 'levelauto': state.levelManual = false; state.level = recommendLevel(state.features).level; break;
    case 'feat': {   // security-feature checklist → auto-recommend a package (unless manually overridden)
      const set = new Set(state.features||[]);
      set.has(v) ? set.delete(v) : set.add(v);
      state.features = [...set];
      if(!state.levelManual) state.level = recommendLevel(state.features).level;
      break;
    }
    case 'prog': state.skipProg = v ? (v==='skip') : !state.skipProg; break;   // oseg sends inc/skip; the install card toggles
    case 'ups': state.ups = (v==='on'); break;
    case 'mon': state.monitorMode = v; state.monitor = v==='buy'; state.mount = v==='buy'; break;
    case 'days': state.desiredDays = +v; state.daysMode = 'preset'; state.extStorage = false; resetStorage(); break;
    case 'daysmode': state.daysMode = 'custom'; state.extStorage = false; if(state.desiredDays<31 || state.desiredDays>60) state.desiredDays = 45; resetStorage(); break;
    case 'dayadj': state.daysMode = 'custom'; state.desiredDays = Math.min(60, Math.max(31, state.desiredDays + +v)); resetStorage(); break;
    case 'extstor': state.extStorage = true; state.daysMode = 'custom'; state.desiredDays = 60; resetStorage(); break;
    case 'stor': state.selectedStorageTB = +v; break;
    case 'storauto': state.selectedStorageTB = null; break;
    case 'nvrup': state.nvrUpgrade = v; state.selectedStorageTB = null; break;
    case 'n12': state.n12 = +v; resetStorage(); break;
    case 'n12d': state.n12 = Math.max(0, Math.min(state.cams, state.n12 + +v)); resetStorage(); break;
    case 'env': state.env = v; break;
    case 'storage': state.storage = v; break;
    case 'toggle': state[v] = !state[v]; if(v==='mount' && state.mount) state.monitor = true; if(v==='monitor' && !state.monitor) state.mount = false; break;
    case 'plan': state.plan = v; break;
    case 'term': state.term = +v; break;
    case 'billing': state.billing = v; break;
    case 'disc': state.discount = +v; break;
    case 'footreset': state.footage = null; state.extraBoxes = 0; break;
    case 'copy': copy(submitted.text); return;
    case 'copyjson': copy(JSON.stringify(submitted.snapshot, null, 2)); return;
    // PUBLIC BUILD — capture the code into the lead; no client-side code list or discount (rep/backend applies it).
    case 'promo': { const code = ($('#promoInput').value||'').trim().toUpperCase(); state.promoCode = code || null; promoMsg=''; render(); return; }
    case 'promoclear': state.promoCode=null; promoMsg=''; render(); return;
    case 'emailfix': { state.contact.email=state.contact.emailSuggest||state.contact.email; state.contact.emailSuggest=''; const el=$('#c_email'); if(el) el.value=state.contact.email; updateEmailSug(); return; }
    case 'submit': if(validateContact(true)) finalizeQuote(); else { go(0); } return;   // invalid → back to Step 1
    case 'edit': submitted = null; render(); go(STEPS.length-1); return;
    case 'editcfg': { if(a.dataset.acc) openAcc=a.dataset.acc; go(a.dataset.step!=null?+a.dataset.step:1); return; }   // Review → jump back to edit a section
    case 'replock': rep = false; render(); renderDrawer(); return;
    case 'reset': Object.assign(state, CONFIG.defaults, { contact:{firstName:'',lastName:'',name:'',phone:'',phoneE164:'',email:'',company:'',address:'',unit:'',placeId:'',lat:null,lng:null,companyPlaceId:'',when:'',notes:''} }); submitted=null; done.clear(); openAcc='property'; try{ localStorage.removeItem(DRAFT_KEY); }catch(_){} closeDrawer(); render(); go(0); return;
    default: return;
  }
  render();
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.num){
    const k = t.dataset.num, val = parseFloat(t.value);
    if(k==='camsrange' || k==='camsnum'){ setCams(val); render(); return; }
    if(k==='daysrange' || k==='daysnum'){ setDays(val); render(); return; }
    if(k==='taxRate') state.taxRate = isFinite(val) ? Math.max(0,val)/100 : 0;
    else if(k==='adjust') state.adjust = isFinite(val) ? Math.round(val*100) : 0;
    else if(k==='extraBoxes') state.extraBoxes = isFinite(val) ? Math.max(0, Math.round(val)) : 0;
    else if(k==='footage') state.footage = isFinite(val) ? Math.max(0, Math.round(val)) : null;
    render();
  } else if(t.dataset.sel){
    const k = t.dataset.sel; state[k] = t.value; render();
  } else if(t.dataset.txt){ state[t.dataset.txt] = t.value; chrome(); }
});
function liveCams(n){
  setCams(n);
  const now = document.querySelector('.cc-now'); if(now) now.textContent = state.cams;
  const num = document.querySelector('[data-num="camsnum"]'); if(num && document.activeElement!==num) num.value = state.cams;
  chrome();
}
// Recording-duration (31–60) synced control, scoped to its own container so it never fights the camera counter.
function setDays(n){ n = Math.min(60, Math.max(31, Math.round(n||31))); state.desiredDays = n; state.daysMode = 'custom'; state.extStorage = false; resetStorage(); }
function liveDays(src, raw){
  if(raw==='') return;   // don't reset the field while the customer is clearing/editing it
  const n = Math.min(60, Math.max(31, Math.round(+raw||31))); setDays(n);
  const box = src.closest('.custom-count'); if(box){
    const now = box.querySelector('.cc-now'); if(now) now.textContent = n;
    const rng = box.querySelector('[data-num="daysrange"]'); if(rng && rng!==src) rng.value = n;
    const num = box.querySelector('[data-num="daysnum"]'); if(num && num!==src && document.activeElement!==num) num.value = n;
  }
  chrome();
}
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.contact){
    const k = t.dataset.contact;
    if(k==='phone'){ t.value = fmtPhone(t.value); const p=t.value.length; try{ t.setSelectionRange(p,p); }catch(_){} state.contact.phone=t.value; state.contact.phoneE164=phoneE164(t.value); }
    else state.contact[k] = t.value;
    if(k==='firstName'||k==='lastName') composeName();
    if(k==='email' && state.contact.emailSuggest){ state.contact.emailSuggest=''; const b=$('.email-sug'); if(b) b.remove(); }
    const er=$('#e_'+k); if(er) er.textContent='';
  }
  if(t.dataset.num==='camsrange' || t.dataset.num==='camsnum'){ liveCams(+t.value); }
  if(t.dataset.num==='daysrange' || t.dataset.num==='daysnum'){ liveDays(t, t.value); }
});
// Final formatting on blur (never mid-typing): name casing + email typo suggestion.
document.addEventListener('focusout', e=>{
  const t = e.target; if(!t.dataset || !t.dataset.contact) return;
  const k = t.dataset.contact;
  if(k==='firstName'||k==='lastName'){ const v=smartName(t.value); if(v!==t.value){ t.value=v; } state.contact[k]=v; composeName(); }
  else if(k==='email'){ state.contact.emailSuggest = emailSuggest(t.value); updateEmailSug(); }
});
// Inject/remove the "did you mean…" hint in place, so an email blur never re-renders (no focus steal).
function updateEmailSug(){
  const field = $('#c_email'); if(!field) return;
  let b = $('.email-sug');
  if(state.contact.emailSuggest){
    if(!b){ b=document.createElement('button'); b.type='button'; b.className='email-sug'; b.dataset.act='emailfix'; field.insertAdjacentElement('afterend', b); }
    b.innerHTML = 'Did you mean <b>'+esc(state.contact.emailSuggest)+'</b>?';
  } else if(b){ b.remove(); }
}
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.file==='floorPlan'){ const f = t.files && t.files[0]; if(!f) return;
    if(f.size > 15*1048576){ state.contact.floorPlanImg = { name:f.name, type:f.type, size:f.size, dataUrl:'', tooBig:true }; render(); return; }
    const rd = new FileReader();
    rd.onload = () => { state.contact.floorPlanImg = { name:f.name, type:f.type||'application/octet-stream', size:f.size, dataUrl:rd.result }; render(); };
    rd.onerror = () => { state.contact.floorPlanImg = { name:f.name, type:f.type, size:f.size, dataUrl:'', error:true }; render(); };
    rd.readAsDataURL(f);
  }
});
document.addEventListener('submit', e=>{
  if(e.target.id==='cform'){ e.preventDefault(); if(validateContact(true)) go(cur+1); return; }
  // PUBLIC BUILD — no rep PIN form.
});
$('#prev').onclick = ()=>go(cur-1);
$('#next').onclick = goNext;
$('#openIndex').onclick = openDrawer;
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && drawer) return closeDrawer();
  // When embedded (homepage overlay), Esc with the drawer closed asks the host to close the overlay.
  if(e.key==='Escape'){ try{ if(window.parent && window.parent!==window){ window.parent.postMessage({ type:'iotcctv:close' }, '*'); return; } }catch(_){} }
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || drawer) return;
  if(e.key==='ArrowRight') goNext();
  if(e.key==='ArrowLeft') go(cur-1);
});
/* swipe */
(()=>{ let x0=null, y0=0, t0=0;
  const vp = $('#viewport');
  vp.addEventListener('pointerdown', e=>{ if(e.target.closest('input,textarea,select,.level-carousel,.cc-slider')) return; x0=e.clientX; y0=e.clientY; t0=Date.now(); });
  vp.addEventListener('pointerup', e=>{ if(x0===null) return; const dx=e.clientX-x0, dy=e.clientY-y0; x0=null;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5 && Date.now()-t0<800){ if(dx<0) goNext(); else go(cur-1); } });
  vp.addEventListener('pointercancel', ()=>x0=null);
})();

/* ---------- address autocomplete ----------
   Google Places on the Address field (US, biased to the NY/NJ metro) when the app provides a Maps key,
   with a free Photon fallback otherwise. The field is rebuilt on every render(), so attachAddr() re-binds
   the fresh input; both paths write the chosen address into state.contact.address. */
var gmapsState = 'idle';   // idle | loading | ready | none
// Lazy: only load Maps (an API call that counts toward quota) once the visitor actually reaches the
// address field — not on every /build page view, so intro bounces cost nothing.
function loadMaps(){
  if(gmapsState!=='idle') return;
  if(location.protocol==='file:'){ gmapsState='none'; attachAddr(); return; }   // standalone file use → Photon only
  gmapsState='loading';
  fetch('/api/config').then(function(r){ return r.json(); }).then(function(cfg){
    var key = cfg && cfg.googleMapsApiKey;
    if(!key){ gmapsState='none'; attachAddr(); return; }
    window.__cctvGmapsReady = function(){ gmapsState='ready'; attachAddr(); };
    var s=document.createElement('script');
    s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&libraries=places&callback=__cctvGmapsReady&loading=async';
    s.async=true; s.defer=true; s.onerror=function(){ gmapsState='none'; attachAddr(); };
    document.head.appendChild(s);
  }).catch(function(){ gmapsState='none'; attachAddr(); });
}
function setAddress(v){ state.contact.address = v; var el=$('#c_address'); if(el) el.value=v; var er=$('#e_address'); if(er) er.textContent=''; }
function attachAddr(){
  var el = document.getElementById('c_address'); if(!el) return;
  if(gmapsState==='idle' && STEPS[cur] && STEPS[cur].id==='details') loadMaps();   // reached the Your Details step → load now
  if(gmapsState==='ready' && window.google && google.maps && google.maps.places){
    bindGoogleAddr(el);
    bindGoogleCompany(document.getElementById('c_company'));
    return;
  }
  if(gmapsState==='none' || gmapsState==='loading'){ bindPhoton(el); }   // fallback / while Maps loads
}
function gBounds(){ return new google.maps.LatLngBounds({lat:39.8,lng:-75.6},{lat:41.5,lng:-73.0}); }   // NY/NJ metro bias
function parseAddr(comps){ var o={}; (comps||[]).forEach(function(c){ var t=c.types||[];
  if(t.indexOf('street_number')>=0) o.num=c.long_name;
  else if(t.indexOf('route')>=0) o.street=c.long_name;
  else if(t.indexOf('locality')>=0) o.city=c.long_name;
  else if(t.indexOf('sublocality')>=0 && !o.city) o.city=c.long_name;
  else if(t.indexOf('administrative_area_level_1')>=0) o.state=c.short_name;
  else if(t.indexOf('postal_code')>=0) o.zip=c.long_name;
  else if(t.indexOf('country')>=0) o.country=c.short_name;
  else if(t.indexOf('subpremise')>=0) o.unit=c.long_name;
}); return o; }
function bindGoogleAddr(el){
  if(el._acBound) return; el._acBound=true;
  document.querySelectorAll('.pac-container').forEach(function(n){ n.remove(); });
  try{
    var ac=new google.maps.places.Autocomplete(el,{ types:['address'], componentRestrictions:{country:'us'}, bounds:gBounds(), fields:['formatted_address','address_components','geometry','place_id'] });
    ac.addListener('place_changed', function(){ var p=ac.getPlace(); if(!p) return; var c=state.contact, a=parseAddr(p.address_components);
      if(p.formatted_address){ c.address=p.formatted_address; el.value=p.formatted_address; }
      c.placeId=p.place_id||''; c.addr=a;
      if(a.unit && !c.unit){ c.unit=a.unit; var u=$('#c_unit'); if(u) u.value=a.unit; }
      if(p.geometry && p.geometry.location){ try{ c.lat=p.geometry.location.lat(); c.lng=p.geometry.location.lng(); }catch(_){} }
      var er=$('#e_address'); if(er) er.textContent='';
    });
  }catch(e){ el._acBound=false; }
}
function bindGoogleCompany(el){
  if(!el || el._acBound) return; el._acBound=true;
  try{
    var ac=new google.maps.places.Autocomplete(el,{ types:['establishment'], componentRestrictions:{country:'us'}, bounds:gBounds(), fields:['name','formatted_address','place_id'] });
    ac.addListener('place_changed', function(){ var p=ac.getPlace(); if(!p) return; var c=state.contact;
      if(p.name){ c.company=p.name; el.value=p.name; }
      c.companyPlaceId=p.place_id||'';
      if(p.formatted_address && !c.address.trim()){ c.address=p.formatted_address; var ae=$('#c_address'); if(ae) ae.value=p.formatted_address; var er=$('#e_address'); if(er) er.textContent=''; }   // offer the business address when the install address is still blank
    });
  }catch(e){ el._acBound=false; }
}
function bindPhoton(el){
  if(el._phBound) return; el._phBound = true;
  var box = document.createElement('div'); box.className='addr-sug';
  el.insertAdjacentElement('afterend', box);
  var timer=null, items=[], last='';
  function close(){ box.classList.remove('open'); box.innerHTML=''; }
  function pick(it){ var p=it.properties||{}; var l1=[p.housenumber,p.street||p.name].filter(Boolean).join(' ');
    var l2=[p.city||p.county,p.state,p.postcode].filter(Boolean).join(', '); setAddress([l1,l2].filter(Boolean).join(', ')); close(); }
  function render(){ if(!items.length){ close(); return; }
    box.innerHTML = items.map(function(it,i){ var p=it.properties||{}; var l1=[p.housenumber,p.street||p.name].filter(Boolean).join(' ')||p.name||'';
      var l2=[p.city||p.county,p.state,p.postcode].filter(Boolean).join(', '); return '<div class="addr-opt" data-i="'+i+'"><b>'+esc(l1)+'</b><span>'+esc(l2)+'</span></div>'; }).join('');
    box.classList.add('open');
    box.querySelectorAll('.addr-opt').forEach(function(o){ o.addEventListener('mousedown', function(ev){ ev.preventDefault(); pick(items[+o.dataset.i]); }); });
  }
  el.addEventListener('input', function(){ if(gmapsState==='ready') return close(); var q=el.value.trim(); clearTimeout(timer);
    if(q.length<3){ close(); return; } if(q===last) return; last=q;
    timer=setTimeout(function(){ fetch('https://photon.komoot.io/api/?q='+encodeURIComponent(q)+'&limit=5&lang=en&lat=40.7128&lon=-74.0060')
      .then(function(r){ return r.json(); }).then(function(d){ items=(d.features||[]).filter(function(x){ return x.properties && x.properties.country; }); render(); })
      .catch(function(){}); }, 250);
  });
  el.addEventListener('blur', function(){ setTimeout(close, 150); });
}

loadDraft();   // resume an interrupted session (per-device draft), then paint
render();
